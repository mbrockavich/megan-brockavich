<style>
  :root{
    --bg:#101227; --surface:#1A1D3A; --surface2:#232750; --line:#33396B;
    --text:#EDEEF7; --muted:#8A90B8; --move:#FF8A5B; --rest:#5566E0;
    --good:#4FD69C; --over:#FF6B7A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto;padding:28px 20px 40px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
  h1{font-size:1.3rem;font-weight:600;letter-spacing:-.01em;margin:0}
  .clock{font-size:.9rem;color:var(--muted)}
  .sub{font-size:.9rem;color:var(--muted);margin:2px 0 22px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
  .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
  .inrow{display:flex;gap:12px;align-items:flex-end;margin-top:10px}
  .field{flex:1}
  input[type=number]{
    width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--line);
    border-radius:12px;padding:12px;font-size:1.7rem;font-family:ui-monospace,Menlo,monospace;
    text-align:center;outline:none;appearance:textfield;-moz-appearance:textfield;
  }
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input:focus{border-color:var(--move)}
  .cap{display:block;text-align:center;font-size:.72rem;color:var(--muted);margin-top:6px}
  .settings{display:flex;flex-wrap:wrap;gap:12px 24px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .mini .lbl{margin-bottom:6px;display:block;text-transform:none;letter-spacing:0;font-size:.75rem}
  .mini input{width:84px;font-size:1rem;padding:8px;text-align:left}
  .hero{background:var(--surface);border:1px solid var(--move);border-radius:18px;padding:26px 20px;text-align:center;margin-bottom:14px}
  .hero .lbl{letter-spacing:.14em}
  .heronum{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:8px}
  .heronum b{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:4rem;line-height:1;color:var(--move)}
  .heronum span{font-size:1.05rem;color:var(--muted)}
  .totrow{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:12px}
  .bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2)}
  .bar .m{background:var(--move)} .bar .r{background:var(--rest)}
  .legend{display:flex;justify-content:space-between;margin-top:8px;font-size:.75rem}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat .lbl{text-transform:none;letter-spacing:0;font-size:.72rem}
  .stat b{display:block;font-family:ui-monospace,Menlo,monospace;font-weight:500;font-size:1.05rem;margin-top:4px}
  .note{font-size:.78rem;color:var(--muted);margin-top:16px;line-height:1.5}
  .panel{background:var(--surface);border-radius:18px;padding:20px}
  .panel p{margin:0} .panel .big{font-size:1.02rem} .panel .small{font-size:.88rem;color:var(--muted);margin-top:6px;line-height:1.5}
  .mrow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
  .mrow:last-child{border-bottom:none}
  .mtime{color:var(--muted)}
  .mval{color:var(--move)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Move to make it under</h1>
    <span class="clock mono" id="clock"></span>
  </div>
  <p class="sub" id="sub"></p>

  <div class="card">
    <span class="lbl">Inactive time so far today</span>
    <div class="inrow">
      <div class="field">
        <input type="number" id="ih" min="0" max="24" value="6" />
        <span class="cap">hours</span>
      </div>
      <div class="field">
        <input type="number" id="im" min="0" max="59" value="0" />
        <span class="cap">minutes</span>
      </div>
    </div>
    <div class="settings">
      <div class="mini"><span class="lbl">Daily goal (hrs)</span><input type="number" id="goal" min="1" max="24" value="10" /></div>
      <div class="mini"><span class="lbl">Deadline (hour, 24h)</span><input type="number" id="target" min="0" max="23" value="22" /></div>
    </div>
  </div>

  <div class="card">
    <span class="lbl">Pace targets (from daily goal &amp; deadline)</span>
    <div id="milestones" style="margin-top:10px"></div>
  </div>

  <div id="result"></div>
</div>

<script>
"use strict";
// guarded storage so it also works inside sandboxed previews
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}
};
var ids=["ih","im","goal","target"];
ids.forEach(function(id){
  var el=document.getElementById(id);
  var saved=store.get("pacer_"+id,null);
  if(saved!==null) el.value=saved;
  el.addEventListener("input",function(){store.set("pacer_"+id,el.value);render();});
});

function fmtHM(t){
  var sign=t<0?"-":""; t=Math.abs(Math.round(t));
  var h=Math.floor(t/60), m=t%60;
  if(h===0) return sign+m+"m";
  if(m===0) return sign+h+"h";
  return sign+h+"h "+m+"m";
}
function fmtClock(dt){
  var h=dt.getHours(),m=dt.getMinutes(),ap=h>=12?"pm":"am";
  h=h%12; if(h===0)h=12;
  return h+":"+String(m).padStart(2,"0")+" "+ap;
}
function num(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}

// Fixed checkpoint times. Budgets are pure pace targets from wake time to the
// deadline hour, spread proportionally across the daily goal - they never
// factor in inactive time entered so far.
var WAKE_HOUR=6;
var MILESTONES=[{h:9,label:"9 AM"},{h:12,label:"12 PM"},{h:17,label:"5 PM"},{h:19,label:"7 PM"}];

function renderMilestones(goalMin,deadlineHour){
  var el=document.getElementById("milestones");
  var span=deadlineHour-WAKE_HOUR;
  if(span<=0){
    el.innerHTML='<p class="small" style="color:var(--muted);margin:0">Deadline must be after 6 AM to see pace targets.</p>';
    return;
  }
  el.innerHTML=MILESTONES.map(function(m){
    var elapsed=Math.min(Math.max(m.h-WAKE_HOUR,0),span);
    var budget=goalMin*elapsed/span;
    return '<div class="mrow"><span class="mtime">By '+m.label+'</span>'
      +'<span class="mval mono">under '+fmtHM(budget)+'</span></div>';
  }).join("");
}

function render(){
  var now=new Date();
  document.getElementById("clock").textContent=fmtClock(now);

  var inactive=num("ih")*60+num("im");
  var goalMin=num("goal")*60;
  var targetHour=Math.min(23,Math.max(0,Math.round(num("target"))));
  var target=new Date(now); target.setHours(targetHour,0,0,0);
  var until=Math.floor((target-now)/60000);

  document.getElementById("sub").textContent=
    "Stay under "+num("goal")+"h of inactive time by "+fmtClock(target)+".";

  renderMilestones(goalMin,targetHour);

  var closed=until<=0;
  var over=inactive>=goalMin;
  var projected=inactive+Math.max(until,0);
  var needRaw=projected-goalMin;
  var need=Math.ceil(Math.max(needRaw,0));
  var onTrack=!over&&needRaw<=0;
  var buffer=goalMin-projected;
  var pace=until>0?Math.ceil(need*60/until):0;
  var rest=Math.max(until-need,0);
  var movePct=until>0?(need/until)*100:0;

  var out=document.getElementById("result");
  var html="";

  if(closed){
    html='<div class="panel" style="border:1px solid var(--muted)">'
      +'<p class="big">It\'s already past '+fmtClock(target)+'.</p>'
      +'<p class="small">Today\'s window is done. You finished at '+fmtHM(inactive)+' inactive, '
      +(over?'<span style="color:var(--over)">'+fmtHM(inactive-goalMin)+' over goal.</span>'
            :'<span style="color:var(--good)">'+fmtHM(goalMin-inactive)+' under goal.</span>')
      +'</p></div>';
  } else if(over){
    html='<div class="panel" style="border:1px solid var(--over)">'
      +'<p class="big">You\'re already at '+fmtHM(inactive)+' inactive.</p>'
      +'<p class="small">That\'s '+fmtHM(inactive-goalMin)+' past the '+num("goal")+'h goal, and past inactive time can\'t be undone. '
      +'Today\'s goal is out of reach, but moving now keeps the overage from growing. Tomorrow resets.</p></div>';
  } else if(onTrack){
    html='<div class="panel" style="border:1px solid var(--good)">'
      +'<p class="big">You\'re on track. No forced movement needed.</p>'
      +'<p class="small">Even resting the whole way to '+fmtClock(target)+', you\'d land at '+fmtHM(projected)+' inactive, '+fmtHM(buffer)+' under goal.</p></div>';
  } else {
    html=''
    +'<div class="hero"><span class="lbl">Move this much every hour</span>'
      +'<div class="heronum"><b>'+pace+'</b><span>min / hour</span></div></div>'
    +'<div class="card">'
      +'<div class="totrow"><span style="color:var(--muted)">Total movement needed</span>'
        +'<span class="mono" style="color:var(--move)">'+fmtHM(need)+'</span></div>'
      +'<div class="bar"><div class="m" style="width:'+movePct+'%"></div><div class="r" style="width:'+(100-movePct)+'%"></div></div>'
      +'<div class="legend"><span style="color:var(--move)">&#9679; Move '+fmtHM(need)+'</span>'
        +'<span style="color:var(--rest)">Rest OK '+fmtHM(rest)+' &#9679;</span></div>'
    +'</div>'
    +'<div class="grid">'
      +'<div class="stat"><span class="lbl">Until deadline</span><b>'+fmtHM(until)+'</b></div>'
      +'<div class="stat"><span class="lbl">If you don\'t move</span><b style="color:var(--over)">'+fmtHM(projected)+'</b></div>'
      +'<div class="stat"><span class="lbl">Room left to rest</span><b>'+fmtHM(goalMin-inactive)+'</b></div>'
    +'</div>'
    +'<p class="note">Follow the pace and you\'ll reach '+fmtClock(target)+' at just under '+num("goal")+'h inactive. Banking movement early buys slack later.</p>';
  }
  out.innerHTML=html;
}
