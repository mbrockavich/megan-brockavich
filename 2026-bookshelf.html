<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Bookshelf</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wood: #6b3a52;
    --wood-dark: #4a2740;
    --wood-darker: #33192c;
    --card: #fdf1f5;
    --ink: #5c3a4a;
    --ink-soft: #a67a92;
    --stamp: #e2789a;
    --brass: #d9a4c0;
    --gold: #e9c27a;

    /* the bookcase itself */
    --case: #3a1d30;
    --case-edge: #2a1322;
    --plank: #7a4a3a;
    --plank-light: #9a6450;
    --plank-dark: #4e2c22;
    --back: #22101c;

    --row-h: clamp(118px, 24vw, 168px);
  }

  *{ box-sizing:border-box; }
  html{ background: var(--wood-darker); }

  body{
    margin:0;
    background:
      radial-gradient(1px 1px at 8% 12%, rgba(255,235,242,0.6), transparent),
      radial-gradient(1px 1px at 22% 68%, rgba(255,235,242,0.45), transparent),
      radial-gradient(1px 1px at 38% 24%, rgba(255,235,242,0.55), transparent),
      radial-gradient(1.5px 1.5px at 54% 82%, rgba(255,235,242,0.45), transparent),
      radial-gradient(1px 1px at 68% 14%, rgba(255,235,242,0.5), transparent),
      radial-gradient(1.5px 1.5px at 79% 55%, rgba(255,235,242,0.55), transparent),
      radial-gradient(1px 1px at 91% 30%, rgba(255,235,242,0.45), transparent),
      radial-gradient(ellipse at top, var(--wood) 0%, var(--wood-dark) 65%, var(--wood-darker) 100%);
    background-attachment: fixed;
    font-family: 'Inter', sans-serif;
    color: var(--card);
    padding: 40px 16px 80px;
    min-height: 100vh;
  }

  .page{ max-width: 760px; margin: 0 auto; }

  nav{ text-align:center; margin-bottom: 22px; }
  nav a{
    font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--brass); text-decoration:none;
  }
  nav a:hover{ color: var(--card); }

  header{ text-align:center; margin-bottom: 28px; }
  .eyebrow{
    font-family:'Space Mono', monospace; letter-spacing:0.28em; font-size:11px;
    text-transform:uppercase; color: var(--brass); margin-bottom: 10px;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:600; margin:0;
    font-size: clamp(34px, 8vw, 54px); letter-spacing: -0.01em; line-height: 1.05;
  }

  /* progress */
  .progress{ margin: 22px auto 0; max-width: 440px; }
  .count{
    font-family:'Fraunces', serif; font-weight:700; font-size: 44px; line-height:1;
  }
  .count small{
    font-family:'Space Mono', monospace; font-weight:400; font-size:18px; color: var(--brass);
  }
  .bar{
    margin: 14px 0 10px; height: 8px; border-radius: 99px;
    background: rgba(253,241,245,0.12); overflow:hidden;
  }
  .bar span{
    display:block; height:100%; border-radius:99px;
    background: linear-gradient(90deg, var(--stamp), var(--gold));
    width: 0; transition: width 1.2s cubic-bezier(.2,.8,.2,1);
  }
  .meta{
    font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.12em;
    text-transform:uppercase; color: var(--brass);
  }

  /* ---------- the bookcase ---------- */
  .bookcase{
    background: linear-gradient(180deg, var(--case) 0%, var(--case-edge) 100%);
    border-radius: 6px 6px 3px 3px;
    padding: 14px 12px 4px;
    box-shadow:
      0 30px 60px rgba(10,2,8,0.55),
      inset 0 0 0 1px rgba(255,255,255,0.04);
    position: relative;
  }
  .bookcase::before{ /* crown molding */
    content:""; position:absolute; left:-8px; right:-8px; top:-12px; height:14px;
    background: linear-gradient(180deg, var(--plank-light), var(--plank-dark));
    border-radius: 4px 4px 2px 2px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
  }

  .row{
    position: relative;
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    grid-template-rows: minmax(0, 1fr);
    align-items: end;
    overflow: hidden;
    gap: 2px;
    height: var(--row-h);
    padding: 10px 6px 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 22%),
      var(--back);
    box-shadow: inset 0 0 18px rgba(0,0,0,0.6);
  }
  .plank{
    height: 14px; margin: 0 -6px 12px;
    background: linear-gradient(180deg, var(--plank-light) 0%, var(--plank) 45%, var(--plank-dark) 100%);
    border-radius: 2px;
    box-shadow: 0 6px 10px rgba(0,0,0,0.45);
    position: relative;
  }
  .plank-label{
    position:absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-family:'Space Mono', monospace; font-size: 8.5px; letter-spacing: 0.14em;
    color: rgba(255,240,230,0.55);
  }

  /* spines */
  .slot{ height:100%; min-height:0; display:flex; align-items:flex-end; justify-content:center; min-width:0; }

  .spine{
    --c: #7b4b94;
    --t: #fdf1f5;
    position: relative;
    appearance: none; border: 0; padding: 0; margin: 0; font: inherit; cursor: pointer;
    width: var(--w, 90%);
    height: var(--h, 85%);
    background:
      linear-gradient(90deg, rgba(0,0,0,0.28) 0%, rgba(255,255,255,0.10) 18%, rgba(255,255,255,0) 40%, rgba(0,0,0,0.05) 70%, rgba(0,0,0,0.30) 100%),
      var(--c);
    color: var(--t);
    border-radius: 2px 2px 1px 1px;
    box-shadow: 0 -1px 0 rgba(255,255,255,0.08) inset, 1px 0 2px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    overflow: hidden;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
    -webkit-tap-highlight-color: transparent;
  }
  .spine::before, .spine::after{ /* little bands top and bottom */
    content:""; position:absolute; left:0; right:0; height: 2px;
    background: currentColor; opacity: 0.35;
  }
  .spine::before{ top: 7%; }
  .spine::after{ bottom: 7%; }
  .spine.fav::before, .spine.fav::after{ background: var(--gold); opacity: 0.95; height: 3px; }

  .spine:hover, .spine:focus-visible{
    transform: translateY(-8px);
    box-shadow: 0 8px 14px rgba(0,0,0,0.5);
    outline: none;
    z-index: 2;
  }
  .spine.pulled{ transform: translateY(-14px); }

  .spine-title{
    position: absolute; left: 50%; top: 50%;
    writing-mode: vertical-rl;
    transform: translate(-50%, -50%) rotate(180deg);
    font-family:'Fraunces', serif; font-weight: 600;
    font-size: clamp(8.5px, 1.7vw, 11px);
    line-height: 1.05;
    max-height: 78%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    letter-spacing: 0.02em;
    pointer-events: none;
  }

  .spine-num{
    position:absolute; bottom: 10%; left:0; right:0; text-align:center;
    font-family:'Space Mono', monospace; font-size: 7px; opacity: 0.7;
    display:none;
  }

  /* empty slots */
  .empty{
    width: 86%; height: 72%;
    border: 1px dashed rgba(217,164,192,0.22);
    border-radius: 2px;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom: 6px;
    font-family:'Space Mono', monospace; font-size: 8px; color: rgba(217,164,192,0.35);
  }
  .empty.next{
    border: 1px dashed rgba(233,194,122,0.75);
    color: var(--gold);
    animation: glow 2.4s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ box-shadow: 0 0 0 rgba(233,194,122,0); }
    50%{ box-shadow: 0 0 14px rgba(233,194,122,0.35); }
  }
  @media (prefers-reduced-motion: reduce){
    .empty.next{ animation:none; }
    .spine, .bar span{ transition:none; }
  }

  .base{
    height: 18px; margin: 0 -12px;
    background: linear-gradient(180deg, var(--plank) 0%, var(--plank-dark) 100%);
    border-radius: 0 0 4px 4px;
  }

  .caption{
    text-align:center; margin: 22px 0 0;
    font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.14em;
    text-transform:uppercase; color: var(--brass);
  }

  /* legend */
  .legend{
    display:flex; flex-wrap:wrap; justify-content:center; gap: 8px 14px;
    margin: 18px auto 0; max-width: 620px;
  }
  .legend span{
    display:inline-flex; align-items:center; gap:6px;
    font-size: 11.5px; color: rgba(253,241,245,0.8);
  }
  .legend i{ width: 9px; height: 14px; border-radius: 1px; display:inline-block; box-shadow: 0 0 0 1px rgba(253,241,245,0.25); }
  .legend .fav-key i{ background: var(--case); border-top: 3px solid var(--gold); border-bottom: 3px solid var(--gold); }

  /* ---------- the pulled-out book ---------- */
  .overlay{
    position: fixed; inset: 0; z-index: 50;
    background: rgba(26,8,20,0.72);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display:none; align-items:center; justify-content:center;
    padding: 16px;
  }
  .overlay.open{ display:flex; animation: fade .2s ease-out; }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

  .book{
    position: relative;
    background: var(--card);
    color: var(--ink);
    width: 100%; max-width: 560px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    border-radius: 14px;
    padding: 26px 24px 20px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.5);
    animation: pop .28s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{ from{ transform: translateY(18px) scale(.97); opacity:0; } to{ transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .book, .overlay.open{ animation:none; } }

  .close{
    position:absolute; top: 10px; right: 10px;
    width: 34px; height: 34px; border-radius: 50%;
    border:0; background: rgba(92,58,74,0.08); color: var(--ink);
    font-size: 20px; line-height: 1; cursor: pointer;
  }
  .close:hover{ background: rgba(92,58,74,0.16); }

  .book-top{ display:flex; gap: 20px; align-items:flex-start; }
  .cover{
    flex: 0 0 auto; width: 120px; aspect-ratio: 2 / 3;
    border-radius: 3px 6px 6px 3px; overflow:hidden;
    background: var(--c, #7b4b94);
    box-shadow: 0 10px 22px rgba(60,20,40,0.35), inset 3px 0 0 rgba(0,0,0,0.15);
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding: 8px;
    font-family:'Fraunces', serif; font-weight:600; font-size: 13px; color: #fdf1f5;
  }
  .cover img{ width:100%; height:100%; object-fit: cover; display:block; margin: -8px; width: calc(100% + 16px); height: calc(100% + 16px); }

  .book-info{ min-width: 0; padding-top: 4px; }
  .book-num{
    font-family:'Space Mono', monospace; font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--stamp); margin-bottom: 6px;
  }
  .book-title{
    font-family:'Fraunces', serif; font-weight: 600; font-size: 22px; line-height: 1.15;
    margin: 0 0 4px; padding-right: 26px;
  }
  .book-author{ font-size: 14px; color: var(--ink-soft); margin-bottom: 12px; }
  .book-rating{ font-family:'Fraunces', serif; font-weight:600; font-size: 18px; color: var(--stamp); }
  .book-rating .tag{ display:block; margin-top:3px; font-family:'Inter',sans-serif; font-weight:400; font-style:italic; font-size:12.5px; color:var(--ink-soft); }

  .facts{
    display:flex; flex-wrap:wrap; gap: 6px; margin-top: 12px;
  }
  .facts span{
    font-family:'Space Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
    background: rgba(226,120,154,0.12); color: var(--ink);
    padding: 4px 8px; border-radius: 99px;
  }

  .note{
    margin-top: 20px; padding-top: 16px;
    border-top: 1px dashed rgba(166,122,146,0.4);
    font-size: 14.5px; line-height: 1.6;
  }
  .note p{ margin: 0 0 10px; }
  .note p:last-child{ margin-bottom: 0; }
  .no-note{ color: var(--ink-soft); font-style: italic; font-size: 13.5px; }

  .book-nav{
    display:flex; justify-content:space-between; align-items:center;
    margin-top: 20px; gap: 10px;
  }
  .book-nav button{
    border: 1px solid rgba(166,122,146,0.4); background: transparent; color: var(--ink);
    font-family:'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 9px 14px; border-radius: 99px; cursor: pointer;
  }
  .book-nav button:hover:not(:disabled){ background: rgba(226,120,154,0.12); }
  .book-nav button:disabled{ opacity: 0.3; cursor: default; }
  .book-nav .pos{ font-family:'Space Mono', monospace; font-size: 10px; color: var(--ink-soft); }

  @media (max-width: 480px){
    body{ padding-top: 28px; }
    .bookcase{ padding: 12px 8px 4px; }
    .row{ padding: 8px 4px 0; gap: 1px; }
    .plank{ margin: 0 -4px 10px; }
    .base{ margin: 0 -8px; }
    .book{ padding: 22px 18px 16px; }
    .book-top{ gap: 14px; }
    .cover{ width: 96px; }
    .book-title{ font-size: 19px; }
  }
</style>
</head>
<body>

<div class="page">
  <nav><a href="library.html">← Megan's Library</a></nav>

  <header>
    <div class="eyebrow">🌙 One Hundred Slots</div>
    <h1>The 2026 Bookshelf</h1>
    <div class="progress">
      <div class="count" id="count">0 <small>/ 100</small></div>
      <div class="bar"><span id="bar"></span></div>
      <div class="meta" id="meta">&nbsp;</div>
    </div>
  </header>

  <div class="bookcase" id="bookcase" aria-label="Bookshelf of books read in 2026"></div>

  <p class="caption">Tap a spine to pull the book off the shelf</p>
  <div class="legend" id="legend"></div>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="book" role="dialog" aria-modal="true" aria-labelledby="bookTitle" id="bookCard">
    <button class="close" id="closeBtn" aria-label="Close">×</button>
    <div class="book-top">
      <div class="cover" id="bookCover"></div>
      <div class="book-info">
        <div class="book-num" id="bookNum"></div>
        <h2 class="book-title" id="bookTitle"></h2>
        <div class="book-author" id="bookAuthor"></div>
        <div class="book-rating" id="bookRating"></div>
      </div>
    </div>
    <div class="facts" id="bookFacts"></div>
    <div class="note" id="bookNote"></div>
    <div class="book-nav">
      <button id="prevBtn" aria-label="Previous book">← Prev</button>
      <span class="pos" id="bookPos"></span>
      <button id="nextBtn" aria-label="Next book">Next →</button>
    </div>
  </div>
</div>

<script src="reading-data.js"></script>
<script>
(function () {
  const SHELF_GOAL = 100;
  const PER_ROW = 10;

  // Spine colors by a book's first genre. `ink` is the title color on that spine.
  const GENRE_COLORS = {
    "Fantasy":                       { c: "#7b4b94", ink: "#fdf1f5" },
    "Science Fiction":               { c: "#3f5f8a", ink: "#eef3fb" },
    "Suspense":                      { c: "#2f4f52", ink: "#e8f3f1" },
    "Horror":                        { c: "#2a1a22", ink: "#e2789a" },
    "Romance":                       { c: "#c25a7c", ink: "#fff3f7" },
    "Literary/Contemporary Fiction": { c: "#6f8f63", ink: "#f6fbf2" },
    "Classic Literature":            { c: "#2e4a3a", ink: "#e9c27a" },
    "Historical Fiction":            { c: "#7a5440", ink: "#fbefe4" },
    "Mythology":                     { c: "#a07a2a", ink: "#fff8e6" },
    "Graphic Novel":                 { c: "#d9963f", ink: "#3a1d30" },
    "Nonfiction":                    { c: "#b9a07a", ink: "#3a1d30" },
    "Memoir/Biography":              { c: "#a0563f", ink: "#fff1ea" },
    "Young Adult":                   { c: "#d9a4c0", ink: "#3a1d30" },
    "Middle Grade":                  { c: "#a8d5ba", ink: "#2a3a30" },
  };
  const FALLBACK = { c: "#6b3a52", ink: "#fdf1f5" };

  const firstGenre = b => [].concat(b.genre || [])[0] || "";
  const colorFor = b => GENRE_COLORS[firstGenre(b)] || FALLBACK;

  // Reading order: earliest finished sits in slot 1.
  const shelf = books
    .map((b, i) => ({ b, i }))
    .sort((x, y) => (x.b.dateFinished || "").localeCompare(y.b.dateFinished || "") || x.i - y.i)
    .map(x => x.b);

  const read = shelf.length;
  const slots = Math.max(SHELF_GOAL, Math.ceil(read / PER_ROW) * PER_ROW);

  const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));

  // Taller and a touch thicker for longer books.
  const pages = shelf.map(b => b.pages || 300);
  const minP = Math.min(...pages, 100), maxP = Math.max(...pages, 600);
  function size(p) {
    const t = (Math.sqrt(p) - Math.sqrt(minP)) / (Math.sqrt(maxP) - Math.sqrt(minP) || 1);
    return { h: 64 + t * 34, w: 70 + t * 30 };
  }
  // Small per-book wobble so the shelf doesn't look machine-cut.
  function jitter(str) {
    let h = 0;
    for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) | 0;
    return ((h >>> 0) % 7) - 3;
  }

  // ---------- header ----------
  const today = new Date();
  const yearEnd = new Date(2026, 11, 31);
  const daysLeft = Math.max(0, Math.ceil((yearEnd - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000));
  const toGo = Math.max(0, SHELF_GOAL - read);

  document.getElementById("count").innerHTML = `${read} <small>/ ${SHELF_GOAL}</small>`;
  requestAnimationFrame(() => {
    document.getElementById("bar").style.width = Math.min(100, read / SHELF_GOAL * 100) + "%";
  });
  let meta;
  if (toGo === 0) meta = "Shelf full · goal reached 🎉";
  else if (today.getFullYear() === 2026 && daysLeft > 0) {
    const perWeek = toGo / (daysLeft / 7);
    meta = `${toGo} to go · ${daysLeft} days left · ~${perWeek.toFixed(1)} a week`;
  } else meta = `${toGo} slots still open`;
  document.getElementById("meta").textContent = meta;

  // ---------- bookcase ----------
  let html = "";
  for (let r = 0; r < slots / PER_ROW; r++) {
    html += `<div class="row">`;
    for (let s = r * PER_ROW; s < (r + 1) * PER_ROW; s++) {
      const b = shelf[s];
      if (b) {
        const col = colorFor(b);
        const sz = size(b.pages || 300);
        const j = jitter(b.title);
        const fav = (b.rating || 0) >= 6;
        html += `<div class="slot"><button class="spine${fav ? " fav" : ""}" data-i="${s}"
          style="--c:${col.c};--t:${col.ink};--h:${Math.min(98, sz.h + j)}%;--w:${Math.min(100, sz.w + j)}%"
          aria-label="Book ${s + 1}: ${esc(b.title)} by ${esc(b.author)}">
          <span class="spine-title">${esc(b.title)}</span></button></div>`;
      } else {
        html += `<div class="slot"><div class="empty${s === read ? " next" : ""}" aria-hidden="true">${s + 1}</div></div>`;
      }
    }
    html += `</div><div class="plank"><span class="plank-label">${r * PER_ROW + 1}–${(r + 1) * PER_ROW}</span></div>`;
  }
  html += `<div class="base"></div>`;
  const bookcase = document.getElementById("bookcase");
  bookcase.innerHTML = html;

  // ---------- legend (only genres actually on the shelf) ----------
  const used = [...new Set(shelf.map(firstGenre))].filter(g => GENRE_COLORS[g]);
  used.sort((a, b) => shelf.filter(x => firstGenre(x) === b).length - shelf.filter(x => firstGenre(x) === a).length);
  document.getElementById("legend").innerHTML =
    used.map(g => `<span><i style="background:${GENRE_COLORS[g].c}"></i>${esc(g)}</span>`).join("") +
    (shelf.some(b => b.rating >= 6) ? `<span class="fav-key"><i></i>6★ all-time favorite</span>` : "");

  // ---------- pulled-out book ----------
  const overlay = document.getElementById("overlay");
  const el = id => document.getElementById(id);
  let current = -1;
  let lastSpine = null;

  const dateFmt = new Intl.DateTimeFormat(undefined, { month: "long", day: "numeric", year: "numeric" });

  function ratingWords(r) {
    if (typeof RATING_LEGEND === "undefined" || r == null) return "";
    const match = RATING_LEGEND.find(x => Math.floor(r) === x.n);
    return match ? match.text : "";
  }

  function show(i) {
    const b = shelf[i];
    if (!b) return;
    current = i;
    const col = colorFor(b);

    const cover = el("bookCover");
    cover.style.setProperty("--c", col.c);
    cover.textContent = b.title;
    if (b.cover) {
      const img = new Image();
      img.alt = `Cover of ${b.title}`;
      img.onload = () => { if (current === i) { cover.textContent = ""; cover.appendChild(img); } };
      img.src = b.cover;
    }

    el("bookNum").textContent = `Book ${i + 1} of ${SHELF_GOAL}`;
    el("bookTitle").textContent = b.title;
    el("bookAuthor").textContent = b.author ? `by ${b.author}` : "";

    const words = ratingWords(b.rating);
    el("bookRating").innerHTML = b.rating != null
      ? `${typeof starRatingHTML === "function" ? starRatingHTML(b.rating) : esc(b.rating) + " ★"}${words ? `<span class="tag">${esc(words)}</span>` : ""}`
      : "";

    const facts = [];
    if (b.dateFinished) facts.push(`Finished ${dateFmt.format(parseLocalDate(b.dateFinished))}`);
    if (b.pages) facts.push(`${b.pages.toLocaleString()} pages`);
    [].concat(b.genre || []).forEach(g => facts.push(g));
    if (b.subgenre) facts.push(b.subgenre);
    if (b.pubYear) facts.push(`Pub. ${b.pubYear}`);
    if (b.spicy) facts.push("🌶️ Spicy");
    el("bookFacts").innerHTML = facts.map(f => `<span>${esc(f)}</span>`).join("");

    el("bookNote").innerHTML = b.note
      ? b.note.split(/\n\s*\n/).map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("")
      : `<div class="no-note">No notes on this one yet.</div>`;

    el("prevBtn").disabled = i === 0;
    el("nextBtn").disabled = i === read - 1;
    el("bookPos").textContent = `${i + 1} / ${read}`;

    document.querySelectorAll(".spine.pulled").forEach(s => s.classList.remove("pulled"));
    const spine = bookcase.querySelector(`.spine[data-i="${i}"]`);
    if (spine) spine.classList.add("pulled");

    el("bookCard").scrollTop = 0;
  }

  function open(i, spine) {
    lastSpine = spine || null;
    show(i);
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    el("closeBtn").focus({ preventScroll: true });
  }

  function close() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    document.querySelectorAll(".spine.pulled").forEach(s => s.classList.remove("pulled"));
    const target = bookcase.querySelector(`.spine[data-i="${current}"]`) || lastSpine;
    if (target) target.focus({ preventScroll: true });
    current = -1;
  }

  bookcase.addEventListener("click", e => {
    const spine = e.target.closest(".spine");
    if (spine) open(Number(spine.dataset.i), spine);
  });
  el("closeBtn").addEventListener("click", close);
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  el("prevBtn").addEventListener("click", () => current > 0 && show(current - 1));
  el("nextBtn").addEventListener("click", () => current < read - 1 && show(current + 1));

  document.addEventListener("keydown", e => {
    if (current < 0) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft" && current > 0) show(current - 1);
    else if (e.key === "ArrowRight" && current < read - 1) show(current + 1);
  });

  // Swipe left/right on the open book to flip through the shelf.
  let sx = null, sy = null;
  el("bookCard").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  el("bookCard").addEventListener("touchend", e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = sy = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    if (dx < 0 && current < read - 1) show(current + 1);
    if (dx > 0 && current > 0) show(current - 1);
  }, { passive: true });
})();
</script>
</body>
</html>
