<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Shopping List · Megan's Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #fff6e3;
    --dot: #ffe9b8;
    --ink: #2b2320;
    --pink: #ff8fab;
    --pink-deep: #e8577e;
    --yellow: #ffd23f;
    --yellow-deep: #e8ac00;
    --mint: #7fe0c0;
    --mint-deep: #2fae87;
    --sky: #8ecbff;
    --sky-deep: #3a8fe0;
    --purple: #c9a8ff;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:
      radial-gradient(var(--dot) 2.5px, transparent 2.5px) 0 0/26px 26px,
      var(--cream);
    color: var(--ink);
    font-family: 'Baloo 2', sans-serif;
    padding: 32px 18px 70px;
    min-height: 100vh;
  }

  .page{ max-width: 900px; margin: 0 auto; }

  nav.topnav{
    text-align:center; margin-bottom: 18px;
    font-family: 'Patrick Hand', cursive;
    font-size: 16px;
  }
  nav.topnav a{ color: var(--sky-deep); text-decoration: none; border-bottom: 2px dashed var(--sky-deep); }
  nav.topnav a:hover{ color: var(--pink-deep); border-color: var(--pink-deep); }
  nav.topnav .sep{ color: var(--ink); opacity:0.35; margin: 0 8px; }

  header{ text-align:center; margin-bottom: 34px; }
  .basket{ font-size: 54px; display:inline-block; transform: rotate(-6deg); animation: wiggle 3.2s ease-in-out infinite; }
  @keyframes wiggle{
    0%, 100%{ transform: rotate(-6deg); }
    50%{ transform: rotate(6deg); }
  }
  header h1{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 6vw, 46px);
    margin: 6px 0 6px;
    color: var(--pink-deep);
    text-shadow: 3px 3px 0 var(--yellow);
    letter-spacing: 0.01em;
  }
  header p{
    font-family: 'Patrick Hand', cursive;
    font-size: 18px;
    margin: 0;
    color: var(--ink);
    opacity: 0.75;
  }

  .progress-pill{
    display:inline-block; margin-top:16px;
    background: #fff; border: 3px solid var(--ink); border-radius: 30px;
    padding: 7px 18px; font-family:'Patrick Hand',cursive; font-size: 16px;
    box-shadow: 3px 3px 0 var(--ink);
  }

  .list{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 26px;
    margin-top: 26px;
  }

  .item{
    position: relative;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 18px 18px 16px;
    display: flex;
    gap: 14px;
    box-shadow: 6px 6px 0 var(--ink);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .item:nth-child(4n+1){ transform: rotate(-1.4deg); background: #fff9f0; }
  .item:nth-child(4n+2){ transform: rotate(1.2deg); background: #f5fffb; }
  .item:nth-child(4n+3){ transform: rotate(-0.8deg); background: #f2f9ff; }
  .item:nth-child(4n+4){ transform: rotate(1.6deg); background: #fdf3ff; }
  .item:hover{ transform: rotate(0deg) translateY(-3px); box-shadow: 8px 8px 0 var(--ink); }

  .item.got{ opacity: 0.55; }
  .item.got .item-title, .item.got .item-author{ text-decoration: line-through wavy var(--pink-deep); }

  .tag{
    position:absolute; top:-14px; left:16px;
    font-family:'Patrick Hand',cursive; font-size: 13px;
    background: var(--yellow); border: 2.5px solid var(--ink); color: var(--ink);
    padding: 3px 10px; border-radius: 20px; transform: rotate(-4deg);
    box-shadow: 2px 2px 0 var(--ink);
  }

  .item-cover{
    flex: 0 0 84px;
    width: 84px; aspect-ratio: 2/3;
    border-radius: 6px; overflow:hidden;
    border: 2.5px solid var(--ink);
    background: var(--purple);
    position:relative;
    display:flex; align-items:center; justify-content:center;
    padding:6px; text-align:center;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:10px; color:#fff;
  }
  .item-cover img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  .item-body{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .item-title{ font-weight:700; font-size: 16.5px; line-height:1.25; margin-bottom:2px; }
  .item-author{ font-family:'Patrick Hand',cursive; font-size: 14px; color: var(--sky-deep); margin-bottom:6px; }
  .item-note{
    font-family:'Patrick Hand',cursive; font-size: 13.5px; color: var(--ink);
    opacity:0.8; line-height:1.4; margin-bottom:10px; flex:1;
  }

  .got-btn{
    align-self:flex-start;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size: 12.5px;
    letter-spacing:0.02em; text-transform:uppercase;
    border: 2.5px solid var(--ink); border-radius: 30px;
    padding: 6px 14px; cursor:pointer;
    background: var(--mint); color: var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .got-btn:active{ transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
  .item.got .got-btn{ background: var(--pink); }

  .empty-state{
    text-align:center; margin-top: 60px;
    font-family:'Patrick Hand',cursive; font-size: 20px; opacity:0.7;
  }

  .doodle-row{
    text-align:center; margin: 46px 0 0; font-size: 22px; letter-spacing: 14px; opacity:0.5;
  }

  footer{
    text-align:center; margin-top: 30px;
    font-family:'Patrick Hand',cursive; font-size: 14px; opacity:0.55;
  }

  @media (max-width: 480px){
    .list{ grid-template-columns: 1fr; }
    .item{ flex-direction:row; }
  }
</style>
</head>
<body>

<div class="page">
  <nav class="topnav">
    <a href="library.html">← Megan's Library</a>
    <span class="sep">·</span>
    <a href="all-books.html">Every Book I've Read</a>
    <span class="sep">·</span>
    <a href="2026-reading-stats.html">2026 Stats</a>
  </nav>

  <header>
    <div class="basket">🛒</div>
    <h1>Book Shopping List</h1>
    <p>Things to track down and buy!</p>
    <div class="progress-pill" id="progressPill">Loading...</div>
  </header>

  <div class="list" id="listGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">Nothing on the list right now. Go read something you'll want to own. 📚</div>

  <div class="doodle-row">✦ ✧ ✦ ✧ ✦</div>
  <footer>Add or remove books in <code>shopping-list-data.js</code>. Checking a box just remembers it on this device.</footer>
</div>

<script src="shopping-list-data.js"></script>
<script>
const STORAGE_KEY = "shoppingListGot";

function loadGot(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveGot(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

let gotState = loadGot();

const listGrid = document.getElementById("listGrid");
const emptyState = document.getElementById("emptyState");
const progressPill = document.getElementById("progressPill");

function renderProgress(){
  const total = SHOPPING_LIST.length;
  const got = SHOPPING_LIST.filter(b => gotState[b.title]).length;
  progressPill.textContent = total === 0
    ? "The list is empty 🎉"
    : `🛍️ ${got} of ${total} picked up`;
}

function render(){
  listGrid.innerHTML = "";
  emptyState.style.display = SHOPPING_LIST.length === 0 ? "block" : "none";

  SHOPPING_LIST.forEach((b, i) => {
    const isGot = !!gotState[b.title];
    const card = document.createElement("div");
    card.className = "item" + (isGot ? " got" : "");

    const coverHtml = `<div class="item-cover">${b.cover ? `<img src="${b.cover}" alt="Cover of ${b.title}" loading="lazy" onerror="this.remove()">` : `<span>${b.title}</span>`}</div>`;

    card.innerHTML = `
      <div class="tag">#${i + 1} on the list</div>
      ${coverHtml}
      <div class="item-body">
        <div class="item-title">${b.title}</div>
        ${b.author ? `<div class="item-author">${b.author}</div>` : ""}
        ${b.note ? `<div class="item-note">${b.note}</div>` : ""}
        <button class="got-btn" type="button">${isGot ? "✓ Got it!" : "Mark as bought"}</button>
      </div>
    `;

    card.querySelector(".got-btn").addEventListener("click", () => {
      gotState[b.title] = !gotState[b.title];
      saveGot(gotState);
      render();
      renderProgress();
    });

    listGrid.appendChild(card);
  });
}

render();
renderProgress();
</script>

</body>
</html>
