<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stats · Megan's Library</title>
<link rel="manifest" href="app-icons/library.webmanifest">
<link rel="apple-touch-icon" href="app-icons/library-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Library">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Same paper look as the Books, Series, Favorites and Owned tabs */
  :root{
    --bg: #f7f4ef;
    --surface: #ffffff;
    --surface-alt: #f0eae0;
    --border: #e4ddd2;
    --border-strong: #d9d2c4;
    --ink: #242018;
    --ink-soft: #6b6455;
    --ink-faint: #a39a89;
    --accent: #b5502f;
    --accent-soft: rgba(181,80,47,0.09);
    --star: #c8963f;
    --sage: #6f8f63;
    --slate: #6b7aa1;
  }
  *{ box-sizing:border-box; }
  html{ overflow-x:hidden; }
  html.modal-open, html.modal-open body{ overflow:hidden; }
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family:'Inter', sans-serif; overflow-x:hidden; -webkit-tap-highlight-color: transparent;
  }
  .page{ max-width: 900px; margin: 0 auto; padding: calc(36px + env(safe-area-inset-top)) 20px 0; }
  .page.page-body{ padding-top: 0; }

  header{ text-align:center; margin-bottom: 14px; }
  header h1{ font-weight:700; letter-spacing:-0.01em; font-size: clamp(27px, 4.4vw, 42px); margin: 0 0 4px; }
  header p{ font-size: 13.5px; color: var(--ink-soft); margin: 0; }

  .card{ background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }

  /* year picker: sticky chips, same as the Favorites genre chips */
  .year-tabs{
    position: sticky; top: env(safe-area-inset-top); z-index: 40;
    display:flex; gap: 7px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling: touch;
    padding: 10px 20px; margin-bottom: 16px;
    background: rgba(247,244,239,0.92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .year-tabs-inner{ display:flex; gap:7px; max-width: 860px; margin: 0 auto; width:100%; }
  .year-tabs::-webkit-scrollbar{ display:none; }
  .year-chip{
    flex: 0 0 auto; font: 600 13.5px 'Inter', sans-serif; padding: 7px 15px; border-radius: 20px;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-soft);
    cursor:pointer; -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums;
  }
  .year-chip .n{ font-weight:500; opacity:.6; font-size: 11.5px; margin-left: 3px; }
  .year-chip[aria-pressed="true"]{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .year-chip:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .section-label{
    font-size: 11.5px; font-weight:600; text-transform: uppercase; letter-spacing: .08em;
    color: var(--accent); margin: 0 2px 8px;
  }
  .block{ margin-bottom: 22px; }

  /* goal card */
  .goal-card{ padding: 18px 18px 16px; }
  .goal-top{ display:flex; align-items:baseline; justify-content:space-between; gap: 12px; }
  .goal-num{ font-size: 38px; font-weight:700; letter-spacing:-0.02em; line-height:1; }
  .goal-num small{ font-size: 18px; font-weight:500; color: var(--ink-faint); margin-left: 2px; }
  .goal-badge{ font-size: 12px; font-weight:600; color: var(--sage); background: rgba(111,143,99,0.12);
    padding: 5px 10px; border-radius: 20px; white-space:nowrap; }
  .goal-badge.behind{ color: var(--accent); background: var(--accent-soft); }
  .goal-caption{ font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }
  .bar{ height: 8px; border-radius: 8px; background: var(--surface-alt); overflow:hidden; margin-top: 12px; }
  .bar > div{ height:100%; border-radius: 8px; background: var(--accent); }
  .stretch{ margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-strong); }
  .stretch-row{ display:flex; justify-content:space-between; font-size: 12.5px; color: var(--ink-soft); }
  .stretch-row b{ color: var(--ink); font-weight:600; }
  .stretch .bar{ height: 6px; margin-top: 8px; }
  .stretch .bar > div{ background: var(--star); }

  /* swipeable stat cards, same as the Books tab */
  .stats-strip{ display:flex; gap: 8px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling: touch;
    margin: 0 -20px; padding: 0 20px; scroll-snap-type: x proximity; scroll-padding-inline: 20px; }
  .stats-strip::-webkit-scrollbar{ display:none; }
  .stat{ flex: 0 0 auto; max-width: 210px; scroll-snap-align:start; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .stat .v{ font-size: 18px; font-weight:700; line-height:1.2; }
  .stat .v.small{ font-size: 13px; font-weight:600; line-height:1.3; }
  .stat .l{ font-size: 10px; text-transform: uppercase; letter-spacing:.05em; color: var(--ink-soft); margin-top: 2px; white-space:nowrap; }

  /* months: 12 tiles, tap one to see that month's books */
  .months{ display:grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px; padding: 12px; }
  .month{
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
    padding: 8px 2px 7px; text-align:center; font-family:'Inter',sans-serif; color: var(--ink);
    position:relative; overflow:hidden;
  }
  button.month{ cursor:pointer; -webkit-tap-highlight-color: transparent; }
  button.month:active{ transform: scale(.96); }
  button.month:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .month .c{ font-size: 18px; font-weight:700; line-height:1.1; position:relative; }
  .month .m{ font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; position:relative; }
  .month .fill{ position:absolute; left:0; right:0; bottom:0; background: var(--accent-soft); }
  .month.best{ border-color: var(--accent); }
  .month.best .c{ color: var(--accent); }
  .month.empty .c{ color: var(--border-strong); }
  .month.future{ border-style: dashed; background: transparent; }
  .month.future .c{ color: transparent; }
  .months-foot{ font-size: 11.5px; color: var(--ink-faint); padding: 0 14px 12px; }

  /* pages per month */
  .bars{ padding: 12px 14px; }
  .bar-row{ display:grid; grid-template-columns: 30px 1fr 48px; align-items:center; gap: 8px; padding: 3px 0; }
  .bar-row .ml{ font-size: 11px; color: var(--ink-soft); }
  .bar-row .track{ height: 10px; border-radius: 6px; background: var(--surface-alt); overflow:hidden; }
  .bar-row .track > div{ height:100%; border-radius: 6px; background: var(--slate); }
  .bar-row .bv{ font-size: 11px; color: var(--ink-soft); text-align:right; font-variant-numeric: tabular-nums; }

  /* genres */
  .genre-list{ list-style:none; margin:0; padding: 4px 0; }
  .genre-row{
    width:100%; display:grid; grid-template-columns: minmax(0, 1fr) 90px 26px; align-items:center; gap: 10px;
    padding: 9px 14px; background:none; border:0; border-bottom: 1px solid var(--border);
    font-family:'Inter',sans-serif; color: var(--ink); text-align:left; cursor:pointer; -webkit-tap-highlight-color: transparent;
  }
  .genre-list li:last-child .genre-row{ border-bottom:0; }
  .genre-row:active{ background: var(--surface-alt); }
  .genre-row:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; border-radius:10px; }
  .genre-row .gn{ font-size: 13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .genre-row .gt{ height: 8px; border-radius: 6px; background: var(--surface-alt); overflow:hidden; }
  .genre-row .gt > div{ height:100%; border-radius: 6px; background: var(--sage); }
  .genre-row .gc{ font-size: 13px; font-weight:600; text-align:right; font-variant-numeric: tabular-nums; }
  .genre-sub{ font-size: 10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color: var(--ink-faint);
    padding: 10px 14px 2px; }
  .missing{ display:flex; flex-wrap:wrap; gap: 6px; padding: 12px 14px 14px; border-top: 1px solid var(--border); }
  .missing-label{ width:100%; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 2px; }
  .missing span.tag{ font-size: 12px; padding: 4px 10px; border-radius: 20px; border: 1px dashed var(--border-strong); color: var(--ink-soft); }

  /* odds and ends */
  .fun-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .fun{ padding: 12px 14px; }
  .fun .fl{ font-size: 11px; font-weight:600; color: var(--ink-soft); }
  .fun .fb{ font-size: 19px; font-weight:700; margin-top: 3px; line-height:1.2; overflow-wrap:anywhere; }
  .fun .fd{ font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; line-height:1.4; }

  footer{ text-align:center; font-size: 11.5px; color: var(--ink-faint); padding: 6px 20px 10px; }

  @media (max-width: 560px){
    .page{ padding: calc(20px + env(safe-area-inset-top)) 16px 0; }
    .year-tabs{ padding: 8px 16px; margin-bottom: 14px; }
    .stats-strip{ margin: 0 -16px; padding: 0 16px; scroll-padding-inline: 16px; }
    .months{ gap: 5px; padding: 10px; }
    .fun-grid{ grid-template-columns: 1fr 1fr; }
    .fun{ padding: 10px 12px; }
    .fun .fb{ font-size: 16px; }
    .fun .fd{ font-size: 11px; }
    .genre-row{ grid-template-columns: minmax(0, 1fr) 64px 24px; gap: 8px; padding: 9px 12px; }
    .genre-row .gn{ font-size: 13px; white-space: normal; line-height: 1.25; }
  }

  /* pop-ups */
  .modal-overlay{
    position:fixed; inset:0; z-index: 500; display:none; align-items:center; justify-content:center;
    background: rgba(36,32,24,0.45); padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    overflow-y:auto; -webkit-overflow-scrolling: touch;
  }
  .modal-overlay.open{ display:flex; }
  .modal-panel{
    position:relative; background: var(--surface); border-radius: 14px; width:100%; max-width: 640px;
    padding: 22px 18px 20px; margin: auto; box-shadow: 0 20px 50px rgba(36,32,24,0.25);
  }
  .modal-close{
    position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%;
    border: 0; background: var(--surface-alt); color: var(--ink-soft); font-size: 14px; cursor:pointer;
  }
  .modal-eyebrow{ font-size: 11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color: var(--accent); margin-bottom: 4px; padding-right: 40px; }
  .modal-title{ font-size: 21px; font-weight:700; margin: 0 0 2px; padding-right: 40px; }
  .modal-sub{ font-size: 12.5px; color: var(--ink-soft); margin-bottom: 14px; }
  .book-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 14px 10px; }
  .gbook{ text-align:left; background:none; border:0; padding:0; font-family:'Inter',sans-serif; color: var(--ink); cursor:pointer; }
  .gbook:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }
  .cover{
    width:100%; aspect-ratio: 2/3; border-radius: 5px; overflow:hidden; position:relative;
    background: var(--surface-alt); border: 1px solid var(--border); margin-bottom: 6px;
    display:flex; align-items:center; justify-content:center; padding: 6px;
    font-size: 10px; font-weight:600; line-height:1.25; color: var(--ink-soft); text-align:center; overflow-wrap:anywhere;
  }
  .cover img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .gbook .t{ font-size: 11.5px; font-weight:600; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .gbook .a{ font-size: 10.5px; color: var(--ink-soft); margin-top: 1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gbook .r{ font-size: 12px; color: var(--star); margin-top: 2px; }
  .group-head{ grid-column: 1 / -1; font-size: 11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color: var(--ink-soft); margin-top: 6px; }
  .group-head:first-child{ margin-top: 0; }

  .detail-panel{ max-width: 380px; text-align:center; }
  .detail-cover{ width: 130px; margin: 4px auto 12px; }
  .detail-title{ font-size: 19px; font-weight:700; margin: 0 0 3px; }
  .detail-author{ font-size: 13px; color: var(--ink-soft); }
  .detail-pills{ display:flex; flex-wrap:wrap; justify-content:center; gap: 5px; margin-top: 10px; }
  .detail-pills span{ font-size: 11px; font-weight:600; padding: 3px 9px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); }
  .detail-meta{ font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; }
  .detail-meta .star-rating{ color: var(--star); }
  .detail-note{ font-size: 12.5px; font-style:italic; color: var(--ink-soft); line-height:1.5; text-align:left;
    border-left: 2px solid var(--accent); padding-left: 10px; margin-top: 12px; white-space: pre-line; }
</style>
<script src="library-tabbar.js" data-theme="paper"></script>
</head>
<body>

<div class="page">
  <header>
    <h1 id="heroTitle">Reading Stats</h1>
    <p id="heroSub">Loading…</p>
  </header>
</div>

<nav class="year-tabs" aria-label="Pick a year"><div class="year-tabs-inner" id="yearTabs"></div></nav>

<div class="page page-body">
  <section class="block" id="goalBlock"></section>
  <section class="block"><div class="stats-strip" id="statsStrip"></div></section>

  <section class="block">
    <div class="section-label">Books per month</div>
    <div class="card"><div class="months" id="months"></div><div class="months-foot">Tap a month to see what you read.</div></div>
  </section>

  <section class="block" id="pagesBlock">
    <div class="section-label">Pages per month</div>
    <div class="card bars" id="pagesChart"></div>
  </section>

  <section class="block">
    <div class="section-label">By genre</div>
    <div class="card" id="genreCard"></div>
  </section>

  <section class="block">
    <div class="section-label">Odds and ends</div>
    <div class="fun-grid" id="funGrid"></div>
  </section>

  <footer id="pageFoot"></footer>
</div>

<!-- list of books (a month or a genre) -->
<div class="modal-overlay" id="listOverlay">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="listTitle">
    <button class="modal-close" id="listClose" aria-label="Close">✕</button>
    <div class="modal-eyebrow" id="listEyebrow"></div>
    <h2 class="modal-title" id="listTitle"></h2>
    <div class="modal-sub" id="listSub"></div>
    <div class="book-grid" id="listGrid"></div>
  </div>
</div>

<!-- one book, on top of the list -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal-panel detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <button class="modal-close" id="detailClose" aria-label="Close">✕</button>
    <div class="detail-cover"><div class="cover" id="detailCover"></div></div>
    <h3 class="detail-title" id="detailTitle"></h3>
    <div class="detail-author" id="detailAuthor"></div>
    <div class="detail-pills" id="detailPills"></div>
    <div class="detail-meta" id="detailMeta"></div>
    <div class="detail-note" id="detailNote"></div>
  </div>
</div>

<script src="reading-data.js"></script>
<script>
/* GOAL, books, pastReads, SERIES, parseLocalDate, formatRating and
   starRatingHTML come from reading-data.js.

   Pick a year at the top. This year's books have exact finish dates and
   page counts, so it gets the goal card, pages chart and pace stats.
   Earlier years (pastReads) only record the month, so those parts hide. */

const MASTER_GENRES = [
  "Fantasy","Science Fiction","Suspense","Horror","Romance","Literary/Contemporary Fiction",
  "Classic Literature","Historical Fiction","Mythology","Graphic Novel","Nonfiction","Memoir/Biography"
];
const AGE_TAGS = ["Young Adult", "Middle Grade"];
const GENRE_EMOJI = {
  "Fantasy":"🐉","Science Fiction":"🚀","Suspense":"🔪","Horror":"🎃","Romance":"💛",
  "Literary/Contemporary Fiction":"📖","Classic Literature":"🕰️","Historical Fiction":"🏛️",
  "Mythology":"🏺","Graphic Novel":"🎨","Nonfiction":"🧠","Memoir/Biography":"🪞",
  "Young Adult":"🎒","Middle Grade":"🧸","Spicy":"🌶️"
};
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const STRETCH_GOAL = 100;
const GOAL_YEAR = 2026;           // GOAL in reading-data.js is this year's goal
const MIN_BOOKS_FOR_YEAR = 5;     // years with fewer dated books don't get a button
const TODAY = new Date();

const esc = t => String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const asList = g => (Array.isArray(g) ? g : [g]).filter(Boolean);

/* ---------- one list of every dated book ---------- */
const seriesAuthor = new Map();
SERIES.forEach(s => s.books.forEach(b => seriesAuthor.set(b.title, s.author)));

const ALL = [];
const seen = new Set();
books.forEach(b => {
  const d = parseLocalDate(b.dateFinished);
  seen.add(b.title);
  ALL.push({ title: b.title, author: b.author, genres: asList(b.genre), subgenre: b.subgenre, cover: b.cover,
    rating: b.rating, spicy: !!b.spicy, note: b.note, pages: b.pages || null, date: d, exact: true,
    year: d.getFullYear(), month: d.getMonth() });
});
let undated = 0;
pastReads.forEach(b => {
  if(seen.has(b.title)) return;
  const m = (b.readDate || "").match(/^(\w+)\s+(\d{4})$/);
  const d = m ? new Date(`${m[1]} 1, ${m[2]}`) : null;
  if(!d || isNaN(d)){ undated++; return; }
  ALL.push({ title: b.title, author: b.author || seriesAuthor.get(b.title) || "Unknown", genres: asList(b.genre),
    subgenre: b.subgenre, cover: b.cover, rating: b.rating, spicy: !!b.spicy, note: b.note, pages: null,
    date: d, exact: false, year: d.getFullYear(), month: d.getMonth() });
});

const yearCounts = {};
ALL.forEach(b => { yearCounts[b.year] = (yearCounts[b.year] || 0) + 1; });
const YEARS = Object.keys(yearCounts).map(Number)
  .filter(y => yearCounts[y] >= MIN_BOOKS_FOR_YEAR || y === TODAY.getFullYear())
  .sort((a, b) => b - a);

let year = Number(new URLSearchParams(location.search).get("year"));
if(!YEARS.includes(year)) year = YEARS.includes(TODAY.getFullYear()) ? TODAY.getFullYear() : YEARS[0];

/* ---------- year chips ---------- */
const yearTabs = document.getElementById("yearTabs");
function renderYearTabs(){
  yearTabs.innerHTML = YEARS.map(y =>
    `<button type="button" class="year-chip" data-year="${y}" aria-pressed="${y === year}">${y}<span class="n">${yearCounts[y] || 0}</span></button>`
  ).join("");
}
yearTabs.addEventListener("click", e => {
  const chip = e.target.closest(".year-chip");
  if(!chip) return;
  year = Number(chip.dataset.year);
  const url = new URL(location.href);
  if(year === TODAY.getFullYear()) url.searchParams.delete("year"); else url.searchParams.set("year", year);
  history.replaceState(null, "", url);
  render();
  const tabs = document.querySelector(".year-tabs");
  if(tabs.getBoundingClientRect().top <= parseFloat(getComputedStyle(tabs).top) + 1){
    window.scrollTo({ top: tabs.offsetTop - parseFloat(getComputedStyle(tabs).top), behavior: "instant" });
  }
});

/* ---------- render one year ---------- */
function stat(v, l, small){ return `<div class="stat"><div class="v${small ? " small" : ""}">${esc(v)}</div><div class="l">${esc(l)}</div></div>`; }
function fun(label, big, desc){ return `<div class="card fun"><div class="fl">${label}</div><div class="fb">${esc(big)}</div>${desc ? `<div class="fd">${esc(desc)}</div>` : ""}</div>`; }
const perMonth = x => { const r = Math.round(x * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };
function topOf(counts){ return Object.entries(counts).sort((a, b) => b[1] - a[1])[0]; }

function render(){
  renderYearTabs();
  const list = ALL.filter(b => b.year === year).sort((a, b) => a.date - b.date);
  const n = list.length;
  const isCurrent = year === TODAY.getFullYear();
  const exact = list.length > 0 && list.every(b => b.exact);
  const paged = list.filter(b => b.pages);
  const totalPages = paged.reduce((s, b) => s + b.pages, 0);
  const lastMonth = isCurrent ? TODAY.getMonth() : 11;

  document.title = `${year} Stats · Megan's Library`;
  document.getElementById("heroTitle").textContent = `${year} in Books`;
  document.getElementById("heroSub").textContent = [
    `${n} book${n === 1 ? "" : "s"}`,
    totalPages ? `${totalPages.toLocaleString()} pages` : null,
    isCurrent ? `as of ${TODAY.toLocaleDateString("en-US", {month: "long", day: "numeric"})}` : null
  ].filter(Boolean).join(", ") + ".";

  /* goal (only the year the goal is for) */
  const goalBlock = document.getElementById("goalBlock");
  if(year === GOAL_YEAR && typeof GOAL === "number"){
    const pct = Math.min(100, Math.round(n / GOAL * 100));
    const left = GOAL - n;
    const monthsLeft = Math.max(11 - TODAY.getMonth(), 1);
    const badge = left <= 0
      ? `<span class="goal-badge">Goal met${n > GOAL ? ` · ${n - GOAL} past` : ""}</span>`
      : `<span class="goal-badge behind">${left} to go</span>`;
    const caption = left <= 0
      ? `You hit ${GOAL} for ${year}.`
      : `About ${perMonth(left / monthsLeft)} books a month to get there.`;
    const sLeft = STRETCH_GOAL - n;
    goalBlock.innerHTML = `
      <div class="section-label">Goal</div>
      <div class="card goal-card">
        <div class="goal-top"><div class="goal-num">${n}<small>/ ${GOAL}</small></div>${badge}</div>
        <div class="bar"><div style="width:${pct}%"></div></div>
        <div class="goal-caption">${caption}</div>
        <div class="stretch">
          <div class="stretch-row"><span>🚀 Stretch goal: <b>${STRETCH_GOAL}</b></span><span><b>${n}</b> / ${STRETCH_GOAL}</span></div>
          <div class="bar"><div style="width:${Math.min(100, Math.round(n / STRETCH_GOAL * 100))}%"></div></div>
          <div class="goal-caption">${sLeft <= 0 ? "Stretch goal met too." : `${sLeft} to go, about ${perMonth(sLeft / monthsLeft)} a month.`}</div>
        </div>
      </div>`;
    goalBlock.style.display = "";
  } else {
    goalBlock.innerHTML = "";
    goalBlock.style.display = "none";
  }

  /* months */
  const byMonth = Array.from({length: 12}, () => []);
  list.forEach(b => byMonth[b.month].push(b));
  const max = Math.max(1, ...byMonth.map(m => m.length));
  const bestIdx = byMonth.reduce((best, m, i) => m.length > byMonth[best].length ? i : best, 0);
  document.getElementById("months").innerHTML = byMonth.map((m, i) => {
    if(i > lastMonth) return `<div class="month future" aria-hidden="true"><div class="c">0</div><div class="m">${MONTHS[i]}</div></div>`;
    const cls = "month" + (m.length ? "" : " empty") + (m.length && i === bestIdx ? " best" : "");
    const inner = `<div class="fill" style="height:${Math.round(m.length / max * 100)}%"></div><div class="c">${m.length}</div><div class="m">${MONTHS[i]}</div>`;
    return m.length
      ? `<button type="button" class="${cls}" data-month="${i}" aria-label="${m.length} books in ${MONTHS_LONG[i]}">${inner}</button>`
      : `<div class="${cls}">${inner}</div>`;
  }).join("");

  /* pages per month (only when page counts exist) */
  const pagesBlock = document.getElementById("pagesBlock");
  if(totalPages){
    const pages = byMonth.map(m => m.reduce((s, b) => s + (b.pages || 0), 0));
    const pmax = Math.max(1, ...pages);
    document.getElementById("pagesChart").innerHTML = pages.slice(0, lastMonth + 1).map((p, i) =>
      `<div class="bar-row"><div class="ml">${MONTHS[i]}</div><div class="track"><div style="width:${p / pmax * 100}%"></div></div><div class="bv">${p.toLocaleString()}</div></div>`
    ).join("");
    pagesBlock.style.display = "";
  } else {
    pagesBlock.style.display = "none";
  }

  /* quick stats */
  const rated = list.filter(b => b.rating != null);
  const avgRating = rated.length ? rated.reduce((s, b) => s + b.rating, 0) / rated.length : null;
  const authorCounts = {};
  list.forEach(b => { if(b.author !== "Unknown") authorCounts[b.author] = (authorCounts[b.author] || 0) + 1; });
  const topAuthor = topOf(authorCounts);
  const fiveStar = rated.filter(b => b.rating >= 5).length;
  document.getElementById("statsStrip").innerHTML = [
    stat(n, "Books"),
    totalPages ? stat(totalPages.toLocaleString(), "Pages") : "",
    avgRating != null ? stat(formatRating(avgRating), "Average rating") : "",
    stat(fiveStar, "5★ and up"),
    n ? stat(MONTHS_LONG[bestIdx], `Best month · ${byMonth[bestIdx].length}`) : "",
    topAuthor ? stat(topAuthor[0], `Top author · ${topAuthor[1]}`, true) : ""
  ].join("");

  /* genres */
  const genreCounts = {};
  list.forEach(b => b.genres.forEach(g => { genreCounts[g] = (genreCounts[g] || 0) + 1; }));
  const genres = Object.entries(genreCounts).filter(([g]) => !AGE_TAGS.includes(g)).sort((a, b) => b[1] - a[1]);
  const extras = AGE_TAGS.map(t => [t, genreCounts[t] || 0]).filter(([, c]) => c);
  const spicy = list.filter(b => b.spicy).length;
  if(spicy) extras.push(["Spicy", spicy]);
  const gmax = genres.length ? genres[0][1] : 1;
  const row = ([g, c]) => `<li><button type="button" class="genre-row" data-genre="${esc(g)}">
      <span class="gn">${GENRE_EMOJI[g] || "📚"} ${esc(g)}</span>
      <span class="gt"><div style="width:${Math.max(6, c / gmax * 100)}%"></div></span>
      <span class="gc">${c}</span></button></li>`;
  const missing = MASTER_GENRES.filter(g => !genreCounts[g]);
  document.getElementById("genreCard").innerHTML = n ? `
    <ul class="genre-list">${genres.map(row).join("")}</ul>
    ${extras.length ? `<div class="genre-sub">Also tracked</div><ul class="genre-list">${extras.map(row).join("")}</ul>` : ""}
    ${missing.length ? `<div class="missing"><div class="missing-label">Not read in ${year}</div>${missing.map(g => `<span class="tag">${GENRE_EMOJI[g] || "📚"} ${esc(g)}</span>`).join("")}</div>` : ""}
  ` : `<div class="missing" style="border:0">Nothing logged for ${year} yet.</div>`;

  /* odds and ends */
  const cards = [];
  if(totalPages){
    const longest = paged.reduce((a, b) => b.pages > a.pages ? b : a);
    const shortest = paged.reduce((a, b) => b.pages < a.pages ? b : a);
    const startOfYear = new Date(year, 0, 1);
    const endPoint = isCurrent ? new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate()) : new Date(year, 11, 31);
    const days = Math.floor((endPoint - startOfYear) / 86400000) + 1;
    cards.push(fun("📏 Average book", `${Math.round(totalPages / paged.length)} pages`));
    cards.push(fun("📖 Pages per day", (totalPages / days).toFixed(1), `Across ${days} days of ${year}.`));
    cards.push(fun("🐘 Longest", `${longest.pages} pages`, longest.title));
    cards.push(fun("🐁 Shortest", `${shortest.pages} pages`, shortest.title));
    cards.push(fun("📚 Stack height", `${(totalPages * 0.1 / 304.8).toFixed(1)} ft`, "Every page, stacked."));
  }
  if(exact && list.length > 1){
    const gaps = list.slice(1).map((b, i) => Math.round((b.date - list[i].date) / 86400000));
    cards.push(fun("⚡ Fastest finish", `${Math.min(...gaps)} days`, "Shortest gap between two books."));
    cards.push(fun("🐢 Slowest stretch", `${Math.max(...gaps)} days`, "Longest gap between two books."));
    cards.push(fun("🎯 Average pace", `${(gaps.reduce((s, g) => s + g, 0) / gaps.length).toFixed(1)} days`, "Per book."));
  }
  if(isCurrent && n){
    const monthsIn = TODAY.getMonth() + TODAY.getDate() / 30;
    cards.push(fun("🔮 On pace for", Math.round(n / monthsIn * 12), "Books by Dec 31 at this rate."));
  }
  const series = new Set(list.map(b => (SERIES.find(s => s.books.some(sb => sb.title === b.title)) || {}).name).filter(Boolean));
  if(series.size) cards.push(fun("🔗 Series touched", series.size, "Series with at least one book read."));
  const prev = yearCounts[year - 1];
  if(prev && n) cards.push(fun(`↕️ vs ${year - 1}`, `${n >= prev ? "+" : "−"}${Math.abs(n - prev)}`, `${prev} books the year before.`));
  document.getElementById("funGrid").innerHTML = cards.join("") || `<div class="card fun"><div class="fd">More stats show up once there's more to count.</div></div>`;
  document.getElementById("funGrid").parentElement.style.display = cards.length ? "" : "none";

  document.getElementById("pageFoot").textContent = exact
    ? "📊 Pulled live from reading-data.js."
    : `📊 Before ${GOAL_YEAR}, only the month each book was finished was logged, so page and pace stats start in ${GOAL_YEAR}.${undated ? ` ${undated} older books have no date and aren't counted in any year.` : ""}`;

  current = { list, byMonth };
}
let current = { list: [], byMonth: [] };

/* ---------- pop-ups ---------- */
const listOverlay = document.getElementById("listOverlay");
const detailOverlay = document.getElementById("detailOverlay");
function syncScrollLock(){ document.documentElement.classList.toggle("modal-open", !!document.querySelector(".modal-overlay.open")); }

function coverHTML(b){
  return `<span>${esc(b.title)}</span>${b.cover ? `<img src="${esc(b.cover)}" alt="" loading="lazy" onerror="this.remove()">` : ""}`;
}
function dateText(b){
  return b.exact ? `Finished ${b.date.toLocaleDateString("en-US", {month: "short", day: "numeric"})}` : `Read ${MONTHS_LONG[b.month]} ${b.year}`;
}
function openList(eyebrow, title, sub, groups){
  document.getElementById("listEyebrow").textContent = eyebrow;
  document.getElementById("listTitle").textContent = title;
  document.getElementById("listSub").textContent = sub;
  const grid = document.getElementById("listGrid");
  grid.innerHTML = "";
  const shown = [];
  groups.forEach(([label, booksIn]) => {
    if(label) grid.insertAdjacentHTML("beforeend", `<div class="group-head">${esc(label)} · ${booksIn.length}</div>`);
    booksIn.forEach(b => {
      shown.push(b);
      grid.insertAdjacentHTML("beforeend", `<button type="button" class="gbook" data-i="${shown.length - 1}">
        <div class="cover">${coverHTML(b)}</div>
        <div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div>
        ${b.rating ? `<div class="r">${starRatingHTML(b.rating)}</div>` : ""}</button>`);
    });
  });
  grid.onclick = e => { const el = e.target.closest(".gbook"); if(el) openDetail(shown[+el.dataset.i]); };
  listOverlay.scrollTop = 0;
  listOverlay.classList.add("open");
  syncScrollLock();
  document.getElementById("listClose").focus({ preventScroll: true });
}
function openDetail(b){
  document.getElementById("detailCover").innerHTML = coverHTML(b);
  document.getElementById("detailTitle").textContent = b.title;
  document.getElementById("detailAuthor").textContent = b.author;
  document.getElementById("detailPills").innerHTML = b.genres.map(g => `<span>${esc(g)}</span>`).join("") + (b.spicy ? "<span>🌶️ Spicy</span>" : "");
  document.getElementById("detailMeta").innerHTML = [dateText(b), b.pages ? `${b.pages} pages` : "", b.rating ? starRatingHTML(b.rating) : ""].filter(Boolean).join(" · ");
  const note = document.getElementById("detailNote");
  note.textContent = b.note || "";
  note.style.display = b.note ? "" : "none";
  detailOverlay.classList.add("open");
  syncScrollLock();
  document.getElementById("detailClose").focus({ preventScroll: true });
}
function close(el){ el.classList.remove("open"); syncScrollLock(); }
document.getElementById("listClose").onclick = () => close(listOverlay);
document.getElementById("detailClose").onclick = () => close(detailOverlay);
[listOverlay, detailOverlay].forEach(o => o.addEventListener("click", e => { if(e.target === o) close(o); }));
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if(detailOverlay.classList.contains("open")) close(detailOverlay);
  else if(listOverlay.classList.contains("open")) close(listOverlay);
});

document.getElementById("months").addEventListener("click", e => {
  const el = e.target.closest("[data-month]");
  if(!el) return;
  const i = +el.dataset.month;
  const m = current.byMonth[i];
  openList("Books per month", `${MONTHS_LONG[i]} ${year}`, `${m.length} book${m.length === 1 ? "" : "s"}${m.every(b => b.exact) ? ", in the order you finished them" : ""}`, [["", m]]);
});
document.getElementById("genreCard").addEventListener("click", e => {
  const el = e.target.closest("[data-genre]");
  if(!el) return;
  const g = el.dataset.genre;
  const inGenre = current.list.filter(b => g === "Spicy" ? b.spicy : b.genres.includes(g))
    .sort((a, b) => a.author.localeCompare(b.author) || a.date - b.date);
  let groups = [["", inGenre]];
  if(inGenre.some(b => b.subgenre)){
    const by = {};
    inGenre.forEach(b => (by[b.subgenre || "Other"] = by[b.subgenre || "Other"] || []).push(b));
    groups = Object.entries(by).sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
  }
  openList(`Read in ${year}`, `${GENRE_EMOJI[g] || "📚"} ${g}`, `${inGenre.length} book${inGenre.length === 1 ? "" : "s"}`, groups);
});

render();
</script>
</body>
