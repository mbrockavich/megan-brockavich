<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Countdowns</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#D4537E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Countdown" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />

<style>
  :root {
    --pink-50: #FBEAF0;
    --pink-100: #F4C0D1;
    --pink-200: #ED93B1;
    --pink-400: #D4537E;
    --pink-600: #993556;
    --pink-800: #72243E;
    --lav-400: #7F77DD;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: linear-gradient(180deg, var(--pink-50) 0%, #F3E9FB 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--pink-800);
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    gap: 16px;
  }
  .stack {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card {
    width: 100%;
    background: #ffffff;
    border-radius: 24px;
    padding: 20px 20px 22px;
    box-shadow: 0 16px 32px rgba(212, 83, 126, 0.16);
    text-align: center;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    text-align: left;
  }
  .badge {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: var(--pink-100);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .badge svg { width: 24px; height: 24px; }
  .card-head h2 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    color: var(--pink-800);
  }
  .card-head .status {
    font-size: 12px;
    color: var(--pink-600);
    margin: 2px 0 0;
    min-height: 15px;
  }
  .body-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .ring-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    flex: none;
  }
  .ring-wrap svg.ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--pink-50); stroke-width: 10; }
  .ring-progress {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s linear;
  }
  .time-display {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--pink-800);
  }
  .side {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .setup-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .setup-row label {
    font-size: 11px;
    color: var(--pink-600);
    font-weight: 600;
    white-space: nowrap;
  }
  input[type="number"] {
    width: 52px;
    height: 32px;
    border-radius: 10px;
    border: 2px solid var(--pink-100);
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--pink-800);
    outline: none;
    -moz-appearance: textfield;
    min-width: 0;
  }
  input[type="number"]:focus { border-color: var(--pink-400); }
  .set-btn {
    height: 32px;
    padding: 0 10px;
    border-radius: 10px;
    border: none;
    background: var(--pink-100);
    color: var(--pink-800);
    font-weight: 700;
    font-size: 12px;
  }
  .set-btn:active { transform: scale(0.96); }
  .add-row input[type="number"] { flex: 1; width: auto; }
  .controls {
    display: flex;
    gap: 8px;
  }
  button.action {
    flex: 1;
    height: 36px;
    border-radius: 12px;
    border: none;
    font-size: 12.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  button.action:active { transform: scale(0.96); }
  .toggle-btn {
    background: var(--pink-400);
    color: #ffffff;
  }
  .toggle-btn.running {
    background: var(--lav-400);
  }
  .reset-btn {
    background: var(--pink-50);
    color: var(--pink-600);
  }
</style>
</head>
<body>

<div class="stack" id="stack"></div>

<script>
(function () {
  var CATEGORIES = [
    {
      key: 'work',
      label: 'Work',
      color: '#D4537E',
      icon: '<circle cx="34" cy="20" r="8" fill="#D4537E" /><circle cx="66" cy="20" r="8" fill="#D4537E" /><circle cx="50" cy="54" r="34" fill="#D4537E" /><circle cx="50" cy="54" r="27" fill="#ffffff" /><line x1="50" y1="54" x2="50" y2="36" stroke="#D4537E" stroke-width="5" stroke-linecap="round" /><line x1="50" y1="54" x2="63" y2="60" stroke="#D4537E" stroke-width="5" stroke-linecap="round" /><circle cx="50" cy="54" r="4" fill="#D4537E" />'
    },
    {
      key: 'dogs',
      label: 'Dogs',
      color: '#7F77DD',
      icon: '<g transform="rotate(45 50 50)"><rect x="30" y="43" width="40" height="14" rx="7" fill="#7F77DD" /><circle cx="28" cy="40" r="9" fill="#7F77DD" /><circle cx="28" cy="60" r="9" fill="#7F77DD" /><circle cx="72" cy="40" r="9" fill="#7F77DD" /><circle cx="72" cy="60" r="9" fill="#7F77DD" /></g>'
    },
    {
      key: 'writing',
      label: 'Writing',
      color: '#993556',
      icon: '<rect x="20" y="70" width="60" height="10" rx="5" fill="#993556" /><path d="M30 66 L62 20 L80 34 L48 80 Z" fill="#993556" /><path d="M62 20 L80 34 L74 42 L56 28 Z" fill="#ffffff" />'
    }
  ];

  var CIRC = 2 * Math.PI * 42;
  var stack = document.getElementById('stack');

  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }

  function storeKey(cat) { return 'work-countdown-state-v1-' + cat; }

  function defaultState() {
    var h = 8;
    return { totalSeconds: h * 3600, remaining: h * 3600, running: false, lastTs: null };
  }

  function createCountdown(cfg) {
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-head">' +
        '<div class="badge"><svg viewBox="0 0 100 100">' + cfg.icon + '</svg></div>' +
        '<div><h2>' + cfg.label + '</h2><p class="status"></p></div>' +
      '</div>' +
      '<div class="body-row">' +
        '<div class="ring-wrap">' +
          '<svg class="ring-svg" viewBox="0 0 100 100">' +
            '<circle class="ring-bg" cx="50" cy="50" r="42" />' +
            '<circle class="ring-progress" cx="50" cy="50" r="42" stroke="' + cfg.color + '" />' +
          '</svg>' +
          '<div class="time-display">08:00:00</div>' +
        '</div>' +
        '<div class="side">' +
          '<div class="setup-row">' +
            '<label>Hrs</label>' +
            '<input type="number" min="0.25" max="16" step="0.25" value="8" inputmode="decimal" />' +
            '<button class="set-btn">Set</button>' +
          '</div>' +
          '<div class="setup-row add-row">' +
            '<label>+Min</label>' +
            '<input type="number" class="add-input" min="1" step="1" inputmode="numeric" placeholder="20" />' +
            '<button class="set-btn add-btn">Add</button>' +
          '</div>' +
          '<div class="controls">' +
            '<button class="action toggle-btn">Start</button>' +
            '<button class="action reset-btn">Reset</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    stack.appendChild(card);

    var status = card.querySelector('.status');
    var ring = card.querySelector('.ring-progress');
    var display = card.querySelector('.time-display');
    var hoursInput = card.querySelector('input[type="number"]');
    var setBtn = card.querySelector('.set-btn');
    var addInput = card.querySelector('.add-input');
    var addBtn = card.querySelector('.add-btn');
    var toggleBtn = card.querySelector('.toggle-btn');
    var resetBtn = card.querySelector('.reset-btn');

    ring.style.strokeDasharray = CIRC;

    var state = load();
    var timerId = null;

    function load() {
      try {
        var raw = localStorage.getItem(storeKey(cfg.key));
        if (!raw && cfg.key === 'work') raw = localStorage.getItem('work-countdown-state-v1');
        if (!raw) return defaultState();
        var s = JSON.parse(raw);
        if (s.running && s.lastTs) {
          var elapsed = (Date.now() - s.lastTs) / 1000;
          s.remaining -= elapsed;
        }
        if (s.remaining < 0) s.remaining = 0;
        if (s.remaining <= 0) s.running = false;
        return s;
      } catch (e) {
        return defaultState();
      }
    }

    function save() {
      localStorage.setItem(storeKey(cfg.key), JSON.stringify(state));
    }

    function render() {
      display.textContent = fmt(state.remaining);
      var frac = state.totalSeconds > 0 ? state.remaining / state.totalSeconds : 0;
      frac = Math.max(0, Math.min(1, frac));
      ring.style.strokeDashoffset = CIRC * (1 - frac);
      hoursInput.value = Math.round((state.totalSeconds / 3600) * 100) / 100;

      if (state.running) {
        toggleBtn.textContent = 'Stop';
        toggleBtn.classList.add('running');
        status.textContent = 'Running';
      } else if (state.remaining <= 0) {
        toggleBtn.textContent = 'Start';
        toggleBtn.classList.remove('running');
        status.textContent = 'All done!';
      } else if (state.remaining < state.totalSeconds) {
        toggleBtn.textContent = 'Start';
        toggleBtn.classList.remove('running');
        status.textContent = 'Paused';
      } else {
        toggleBtn.textContent = 'Start';
        toggleBtn.classList.remove('running');
        status.textContent = 'Ready';
      }
    }

    function tick() {
      if (!state.running) return;
      var now = Date.now();
      var elapsed = (now - state.lastTs) / 1000;
      state.lastTs = now;
      state.remaining -= elapsed;
      if (state.remaining <= 0) {
        state.remaining = 0;
        state.running = false;
        stopTimer();
      }
      render();
      save();
    }

    function startTimer() {
      if (timerId) return;
      timerId = setInterval(tick, 250);
    }

    function stopTimer() {
      if (timerId) { clearInterval(timerId); timerId = null; }
    }

    setBtn.addEventListener('click', function () {
      state.running = false;
      stopTimer();
      var h = parseFloat(hoursInput.value);
      if (isNaN(h) || h <= 0) h = 8;
      state.totalSeconds = Math.round(h * 3600);
      state.remaining = state.totalSeconds;
      state.lastTs = null;
      render();
      save();
    });

    function addTime() {
      var m = parseFloat(addInput.value);
      if (isNaN(m) || m <= 0) return;
      state.remaining -= m * 60;
      if (state.remaining < 0) state.remaining = 0;
      if (state.remaining <= 0) {
        state.running = false;
        stopTimer();
      }
      addInput.value = '';
      render();
      save();
    }

    addBtn.addEventListener('click', addTime);
    addInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addTime();
      }
    });

    toggleBtn.addEventListener('click', function () {
      if (state.running) {
        state.running = false;
        stopTimer();
      } else {
        if (state.remaining <= 0) return;
        state.running = true;
        state.lastTs = Date.now();
        startTimer();
      }
      render();
      save();
    });

    resetBtn.addEventListener('click', function () {
      state.running = false;
      stopTimer();
      state.remaining = state.totalSeconds;
      state.lastTs = null;
      render();
      save();
    });

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && state.running) {
        state = load();
        render();
        if (state.running) startTimer();
      }
    });

    render();
    if (state.running) startTimer();
  }

  CATEGORIES.forEach(createCountdown);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>

</body>
</html>
