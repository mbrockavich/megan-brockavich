<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fresh Ink</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="fresh-ink/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fresh Ink">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120f24; --bg2:#1b1636; --card:#1f1a3d; --line:rgba(255,255,255,.09);
    --ink:#f4efe6; --soft:#b9b2cf; --faint:#7f78a0;
    --gold:#f0c060; --gold2:#c9922e; --rose:#ff7a9c; --mint:#7fe0c3;
  }
  *{ box-sizing:border-box; }
  /* overflow-x:clip (not hidden) keeps the page from scrolling sideways WITHOUT turning html/body into scroll
     containers, which is what stopped the filter bar from sticking. */
  html{ overflow-x:hidden; overflow-x:clip; scroll-behavior:smooth; }
  body{ margin:0; font-family:'Manrope',sans-serif; color:var(--ink); overflow-x:hidden; overflow-x:clip;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(240,192,96,.16), transparent 60%),
      radial-gradient(700px 500px at -10% 10%, rgba(255,122,156,.12), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    padding-bottom:calc(80px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color:transparent; }
  .wrap{ max-width:860px; margin:0 auto; padding:0 14px; }
  @media (min-width:600px){ .wrap{ padding:0 20px; } }

  .back{ display:inline-block; margin:calc(22px + env(safe-area-inset-top)) 0 0; font-size:12px; color:var(--faint); text-decoration:none; letter-spacing:.05em; }
  .back:hover{ color:var(--gold); }
  header{ text-align:center; padding:22px 0 18px; }
  .kicker{ font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  h1{ font-family:'Fraunces',serif; font-weight:700; font-size:clamp(40px,8vw,72px); line-height:.98; margin:12px 0 14px; letter-spacing:-.02em; }
  h1 em{ font-style:italic; font-weight:500; color:var(--gold); }
  .sub{ color:var(--soft); font-size:14.5px; line-height:1.6; max-width:540px; margin:0 auto; }
  .meter{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:20px; }
  .chip{ border:1px solid var(--line); background:rgba(255,255,255,.04); border-radius:999px; padding:8px 16px; font-size:12.5px; color:var(--soft); }
  .chip b{ color:var(--ink); font-size:15px; margin-right:5px; }
  .legend{ display:flex; justify-content:center; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--faint); margin:16px 0 4px; }

  /* ---- month ---- */
  .month{ margin:34px 0 8px; scroll-margin-top:12px; }
  .mhead{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; padding:0 2px; }
  .mname{ font-family:'Fraunces',serif; font-size:clamp(26px,5vw,36px); font-weight:700; letter-spacing:-.01em; }
  .mname em{ font-style:italic; font-weight:500; color:var(--gold); }
  .mcount{ font-size:12px; color:var(--faint); white-space:nowrap; }
  .dow, .days{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
  @media (min-width:600px){ .dow, .days{ gap:6px; } }
  .dow div{ text-align:center; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:700; padding-bottom:6px; }
  .days{ margin-top:0; }

  .day{ position:relative; aspect-ratio:2/3; border-radius:8px; background:rgba(255,255,255,.035); border:1px solid var(--line); overflow:hidden; }
  .day.blank{ background:none; border:none; }
  .day .n{ position:absolute; left:5px; top:3px; font-size:10.5px; font-weight:700; color:var(--faint); z-index:3; }
  .day .hol{ position:absolute; left:0; right:0; bottom:3px; text-align:center; font-size:clamp(13px,3.4vw,19px); z-index:3; line-height:1; }
  .day.past .n{ opacity:.55; }
  .day.today{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 0 18px rgba(240,192,96,.35); }
  .day.today .n{ color:var(--gold); }
  .day.edge{ border-color:rgba(240,192,96,.55); background:rgba(240,192,96,.08); }
  .day.has{ border:none; background:var(--card); cursor:pointer; box-shadow:0 6px 14px rgba(0,0,0,.45); }
  .day.has .n{ color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.8); background:rgba(18,15,36,.6); border-radius:5px; padding:0 4px; left:3px; top:3px; }
  .day.has .hol{ text-shadow:0 1px 4px rgba(0,0,0,.8); }
  .day:active.has{ transform:scale(.97); }
  .day .cover{ position:absolute; inset:0; }
  .cover img, .cv img{ position:absolute; inset:0; width:100%; height:100%; max-width:100%; object-fit:cover; display:block; }
  .ph{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:5px 4px; }
  .ph .t{ font-family:'Fraunces',serif; font-weight:700; font-size:8.5px; line-height:1.1; color:#fff; text-shadow:0 1px 5px rgba(0,0,0,.4); }
  .ph .a{ display:none; }
  @media (min-width:600px){ .ph .t{ font-size:12px; } .ph{ padding:8px; } }
  .mosaic{ position:absolute; inset:0; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:1px; }
  .tile{ position:relative !important; inset:auto !important; overflow:hidden; }
  .tile .ph .t{ display:none; }
  .more{ position:absolute; left:50%; transform:translateX(-50%); bottom:3px; z-index:4; background:var(--gold); color:#2a1d05; font-size:9.5px; font-weight:800; white-space:nowrap;
    border-radius:999px; padding:2px 7px; box-shadow:0 2px 6px rgba(0,0,0,.5); }
  .day.has.multi .hol{ bottom:auto; top:3px; left:auto; right:4px; width:auto; }
  .chk{ position:absolute; left:3px; bottom:3px; z-index:4; width:17px; height:17px; border-radius:50%; background:var(--mint); color:#06251c;
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.5); }
  .day.allread .cover{ filter:saturate(.5) brightness(.6); }
  .ballot26{ outline:1.5px dashed rgba(255,255,255,.4); outline-offset:-3px; border-radius:8px; position:absolute; inset:0; z-index:2; }

  .tbc{ margin-top:12px; padding:12px 12px 10px; border:1px dashed var(--line); border-radius:12px; background:rgba(255,255,255,.025); }
  .tbc h4{ margin:0 0 10px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .tbcrow{ display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding-bottom:4px; }
  .tbcrow::-webkit-scrollbar{ display:none; }
  .tb{ flex:0 0 74px; cursor:pointer; position:relative; }
  .tb .cv{ position:relative; aspect-ratio:2/3; border-radius:6px; overflow:hidden; box-shadow:0 6px 14px rgba(0,0,0,.45); }
  .tb .cv .ph .t{ font-size:9px; }
  .tb .bt2{ font-size:10.5px; line-height:1.2; margin-top:5px; color:var(--soft); font-weight:600; }
  .tb.read .cv{ filter:saturate(.5) brightness(.6); }
  .tb .chk{ left:auto; right:3px; top:3px; bottom:auto; }
  .tba{ margin-top:46px; }
  .none{ color:var(--soft); font-style:italic; padding:34px 0; text-align:center; }
  .bar{ position:sticky; top:0; z-index:30; margin:0 -14px 0; padding:calc(14px + env(safe-area-inset-top)) 14px 12px; background:rgba(18,15,36,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  @media (min-width:600px){ .bar{ margin:0 -20px 0; padding:calc(14px + env(safe-area-inset-top)) 20px 12px; } }
  .hdr{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .hback{ font-size:30px; line-height:1; color:var(--soft); text-decoration:none; padding:0 6px 4px 0; }
  .hback:hover{ color:var(--gold); }
  .hico{ width:30px; height:30px; border-radius:8px; flex:0 0 auto; }
  .htitle{ font-family:'Fraunces',serif; font-weight:700; font-size:22px; letter-spacing:-.01em; flex:1; white-space:nowrap; }
  .htitle em{ font-style:italic; font-weight:500; color:var(--gold); }
  .hcount{ font-size:12px; color:var(--faint); white-space:nowrap; }
  .hbtn{ padding:7px 14px; }
  header{ padding-top:20px; }
  .pills{ display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .pills::-webkit-scrollbar{ display:none; }
  .pill{ flex:0 0 auto; font:inherit; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer;
    background:transparent; color:var(--soft); border:1px solid var(--line); white-space:nowrap; }
  .pill:hover{ color:var(--ink); border-color:var(--gold2); }
  .pill.on{ background:var(--gold); color:#2a1d05; border-color:var(--gold); }
  .pill .n{ opacity:.6; margin-left:5px; font-size:11px; }
  .month{ scroll-margin-top:calc(var(--barh,160px) + 10px); }
  .tools{ display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:nowrap; }
  .tools label{ font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); font-weight:700; display:flex; align-items:center; gap:4px; flex:0 0 auto; }
  .tools select{ font:inherit; font-size:12px; font-weight:600; color:var(--ink); background:rgba(255,255,255,.07); border:1px solid var(--line);
    border-radius:10px; padding:6px 5px; width:78px; -webkit-appearance:none; appearance:none; text-align:center; text-align-last:center; }
  .tools select:focus{ outline:none; border-color:var(--gold2); }
  .seg{ margin-left:auto; gap:4px; flex:0 0 auto; }
  .seg .pill{ padding:6px 9px; font-size:11.5px; }

  /* ---- sheet ---- */
  /* Sheet sizing uses dvh so it fits the *visible* screen (iOS browser toolbars make plain vh too tall),
     scrolls on its own, and never scrolls the page behind it. */
  .veil{ position:fixed; inset:0; background:rgba(8,6,20,.7); backdrop-filter:blur(6px); z-index:60; display:none; align-items:flex-end; justify-content:center;
    overscroll-behavior:contain; touch-action:none; }
  .veil.open{ display:flex; }
  html.locked body{ position:fixed; left:0; right:0; width:100%; overflow:hidden; }
  .sheet{ width:100%; max-width:560px; background:var(--bg2); border:1px solid var(--line); border-radius:22px 22px 0 0;
    padding:0 20px calc(28px + env(safe-area-inset-bottom)); max-height:calc(100vh - 110px); max-height:calc(100dvh - 70px);
    overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; margin-bottom:0; }
  @media (min-width:700px){ .veil{ align-items:center; } .sheet{ border-radius:22px; max-height:85vh; } }
  .shead{ position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--bg2); padding:18px 0 12px; margin-bottom:6px; border-bottom:1px solid var(--line); }
  .sdate{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); font-weight:700; line-height:1.4; }
  .xbtn{ flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:rgba(255,255,255,.08);
    color:var(--ink); font:inherit; font-size:18px; line-height:1; cursor:pointer; }
  .sbook{ padding:14px 0; border-top:1px solid var(--line); }
  .sbook:first-of-type{ border-top:none; padding-top:0; }
  .top{ display:flex; gap:14px; }
  .mini{ flex:0 0 92px; width:92px; min-width:0; }
  .top > div:last-child{ min-width:0; }
  .mini .cv{ position:relative; aspect-ratio:2/3; border-radius:6px 9px 9px 6px; overflow:hidden; box-shadow:0 8px 18px rgba(0,0,0,.5); }
  .mini .ph .t{ font-size:12px; } .mini .ph{ padding:8px; }
  .sheet h3{ font-family:'Fraunces',serif; font-size:21px; line-height:1.15; margin:0 0 4px; }
  .by{ color:var(--soft); font-size:14px; margin-bottom:8px; }
  .tags{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0; }
  .tag{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.07); color:var(--soft); }
  .tag.g{ background:rgba(240,192,96,.16); color:var(--gold); }
  .tag.b{ background:rgba(255,122,156,.16); color:var(--rose); text-transform:none; letter-spacing:0; }
  .tag.m{ background:rgba(127,224,195,.18); color:var(--mint); }
  .sbook p{ color:var(--soft); font-size:14px; line-height:1.6; margin:10px 0 0; }
  .gr{ display:block; margin-top:12px; text-align:center; text-decoration:none; font-weight:700; font-size:13.5px; padding:11px; border-radius:12px;
    border:1px solid var(--gold2); color:var(--gold); background:rgba(240,192,96,.08); }
  .gr:hover{ background:rgba(240,192,96,.16); }
  .btn{ width:100%; margin-top:16px; font:inherit; font-weight:700; font-size:14px; padding:12px; border-radius:12px; cursor:pointer; border:1px solid var(--gold); background:var(--gold); color:#2a1d05; }

  .install{ text-align:center; margin:22px 0 0; }
  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom)); z-index:70; background:var(--gold); color:#2a1d05;
    font-weight:700; font-size:13px; padding:11px 16px; border-radius:999px; box-shadow:0 10px 28px rgba(0,0,0,.55); display:flex; gap:12px; align-items:center; white-space:nowrap; }
  .toast button{ font:inherit; font-weight:800; font-size:13px; background:#2a1d05; color:var(--gold); border:none; border-radius:999px; padding:6px 12px; cursor:pointer; }
  .diag{ margin:18px auto 0; max-width:540px; font-size:11px; color:var(--faint); }
  .diag pre{ white-space:pre-wrap; background:rgba(255,255,255,.04); border-radius:8px; padding:10px; margin:8px 0 0; font-family:ui-monospace,monospace; }
  footer{ text-align:center; color:var(--faint); font-size:12px; line-height:1.7; margin:46px auto 0; max-width:540px; }
  .todaybtn{ position:fixed; right:14px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:20; font:inherit; font-size:12.5px; font-weight:700;
    background:var(--gold); color:#2a1d05; border:none; border-radius:999px; padding:10px 16px; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.5); }
</style>
</head>

<div class="wrap">

      <img class="hico" src="fresh-ink/icon-192.png" alt="">
      <div class="htitle">Fresh <em>Ink</em></div>
      <div class="hcount" id="hcount"></div>
      <button class="pill on hbtn" id="todayBtn">Today</button>

<script>
/* Standalone page: depends only on watchlist-data.js. */
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH_FULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const key=b=>b.title+"|"+b.author;
const iso=(y,m,d)=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
function pd(str){const p=String(str).split("-").map(Number);
  if(p.length===3)return{y:p[0],m:p[1],d:p[2],exact:true};
  if(p.length===2)return{y:p[0],m:p[1],d:null,exact:false};
  return{y:p[0],m:null,d:null,exact:false};}
const items=watchlist.map(b=>({...b,p:pd(b.date)}));   /* read:true is set by hand in the data file */
const now=new Date(), todayISO=iso(now.getFullYear(),now.getMonth()+1,now.getDate());
const winStart=WATCHLIST_META.windowStart, winEnd=WATCHLIST_META.windowEnd;
const BALLOT26_START="2025-11-12";   /* 2026 Goodreads Choice window: Nov 12 2025 to Nov 10 2026 */

/* ---- holidays (computed so they stay right every year) ---- */
function nthDow(y,m,dow,n){const first=new Date(y,m-1,1).getDay();return 1+((dow-first+7)%7)+7*(n-1);}
function lastDow(y,m,dow){const last=new Date(y,m,0);return last.getDate()-((last.getDay()-dow+7)%7);}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return[mo,da];}
const holCache={};
function holidays(y){
  if(holCache[y])return holCache[y];
  const h={}, add=(m,d,e,n)=>{h[iso(y,m,d)]={e,n};}, [em,ed]=easter(y);
  add(1,1,"🎉","New Year's Day"); add(1,nthDow(y,1,1,3),"✊","MLK Day");
  add(2,2,"🦫","Groundhog Day"); add(2,14,"🥰","Valentine's Day"); add(2,nthDow(y,2,1,3),"🇺🇸","Presidents' Day");
  add(3,17,"🍀","St. Patrick's Day"); add(em,ed,"🐣","Easter"); add(4,22,"🌍","Earth Day");
  add(5,5,"🌮","Cinco de Mayo"); add(5,nthDow(y,5,0,2),"💐","Mother's Day"); add(5,lastDow(y,5,1),"🇺🇸","Memorial Day");
  add(6,19,"✨","Juneteenth"); add(6,nthDow(y,6,0,3),"👔","Father's Day"); add(7,4,"🎆","Independence Day");
  add(9,nthDow(y,9,1,1),"🧺","Labor Day"); add(10,31,"🎃","Halloween");
  add(11,nthDow(y,11,4,4),"🦃","Thanksgiving"); add(11,nthDow(y,11,4,4)+1,"🛍️","Black Friday");
  add(12,24,"🎄","Christmas Eve"); add(12,25,"🎁","Christmas"); add(12,31,"🥂","New Year's Eve");
  return holCache[y]=h;
}

/* ---- covers: cover (url) -> isbn (Open Library) -> browser lookup (Google Books, Open Library) -> placeholder ---- */
const coverCache=lsGet("watchlist-covers-v2",{});
function srcList(b){const l=[];
  if(b.cover)l.push(b.cover);
  if(b.isbn)l.push(`https://covers.openlibrary.org/b/isbn/${b.isbn}-L.jpg?default=false`);
  if(b.isbn&&isbn10(b.isbn))l.push(`https://images-na.ssl-images-amazon.com/images/P/${isbn10(b.isbn)}.01.LZZZZZZZ.jpg`);
  if(coverCache[key(b)])l.push(coverCache[key(b)]);
  return l;}
function isbn10(i13){ if(!/^978\d{10}$/.test(i13))return null; const d=i13.slice(3,12); let sum=0;
  for(let k=0;k<9;k++)sum+=(10-k)*+d[k]; const c=(11-sum%11)%11; return d+(c===10?"X":c); }
function nextSrc(img){const l=JSON.parse(img.dataset.srcs||"[]");const i=+img.dataset.i+1;if(i<l.length){img.dataset.i=i;img.src=l[i];}else img.remove();}
const norm=x=>String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const sameTitle=(a,b)=>{a=norm(a);b=norm(b);return a&&b&&(a.includes(b.slice(0,14))||b.includes(a.slice(0,14)));};
const coverLog={google:{ok:0,miss:0,err:{}},apple:{ok:0,miss:0,err:{}},openlib:{ok:0,miss:0,err:{}},img:"testing..."};
const logErr=(src,e,status)=>{const k=status?("HTTP "+status):String(e&&e.message||e);coverLog[src].err[k]=(coverLog[src].err[k]||0)+1;renderDiag();};
async function lookup(b){
  const last=b.author.split(" ").pop().replace(/[^\w]/g,"");
  const t=b.title.replace(/[:&].*$/,"").replace(/\(.*?\)/g,"").trim();
  try{
    const r=await fetch("https://www.googleapis.com/books/v1/volumes?maxResults=6&q="+encodeURIComponent(`intitle:${t} inauthor:${last}`));
    if(r.ok){const j=await r.json();const v=(j.items||[]).find(x=>x.volumeInfo&&x.volumeInfo.imageLinks&&sameTitle(x.volumeInfo.title,t));
      if(v){coverLog.google.ok++;const u=(v.volumeInfo.imageLinks.thumbnail||v.volumeInfo.imageLinks.smallThumbnail).replace("http://","https://").replace("&edge=curl","");return u+"&zoom=2";}
      coverLog.google.miss++;
    }else logErr("google",0,r.status);
  }catch(e){logErr("google",e);}
  try{   /* Apple Books lists preorders, so it often has covers the others don't yet */
    const r=await fetch("https://itunes.apple.com/search?"+new URLSearchParams({term:t+" "+b.author,media:"ebook",limit:"8"}));
    if(r.ok){
      const j=await r.json(), w=t.toLowerCase();
      const hit=(j.results||[]).find(x=>x.artworkUrl100&&sameTitle(x.trackName,t)&&(x.artistName||"").toLowerCase().includes(last.toLowerCase()));
      if(hit){coverLog.apple.ok++;return hit.artworkUrl100.replace(/\/\d+x\d+bb/,"/600x600bb");}
      coverLog.apple.miss++;
    }else logErr("apple",0,r.status);
  }catch(e){logErr("apple",e);}
  try{
    const r=await fetch("https://openlibrary.org/search.json?"+new URLSearchParams({title:t,author:b.author,limit:"5",fields:"cover_i,title"}));
    if(r.ok){const d=((await r.json()).docs||[]).find(x=>x.cover_i&&sameTitle(x.title,t));if(d){coverLog.openlib.ok++;return `https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`;}coverLog.openlib.miss++;}
    else logErr("openlib",0,r.status);
  }catch(e){logErr("openlib",e);}
  return null;
}
function renderDiag(){
  const el=document.getElementById("diag"); if(!el)return;
  const f=o=>`found ${o.ok}, no match ${o.miss}, errors ${Object.keys(o.err).length?Object.entries(o.err).map(([k,v])=>k+" x"+v).join("; "):"none"}`;
  const shown=document.querySelectorAll(".day img, .tb img").length;
  el.textContent=`Covers showing: ${shown}\nGoogle Books: ${f(coverLog.google)}\nApple Books: ${f(coverLog.apple)}\nOpen Library: ${f(coverLog.openlib)}\nCover image host test: ${coverLog.img}`;
}
function probeImages(){
  const im=new Image(); im.onload=()=>{coverLog.img="loaded OK";renderDiag();}; im.onerror=()=>{coverLog.img="FAILED to load";renderDiag();};
  im.src="https://covers.openlibrary.org/b/isbn/9781524875541-L.jpg?t="+Date.now();
}
setInterval(renderDiag,2000);
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h;};
function coverInner(b){
  const h=hue(b.title+b.author), l=srcList(b);
  const ph=`<div class="ph" style="background:linear-gradient(155deg,hsl(${h},48%,34%),hsl(${(h+50)%360},55%,18%))"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div></div>`;
  return l.length?`${ph}<img src="${esc(l[0])}" data-srcs="${esc(JSON.stringify(l))}" data-i="0" alt="Cover of ${esc(b.title)}" loading="lazy" onload="if(this.naturalWidth<60)nextSrc(this)" onerror="nextSrc(this)">`:ph;
}
async function findCovers(){
  const todo=items.filter(b=>!b.cover&&!(key(b) in coverCache));
  async function worker(){
    while(todo.length){
      const b=todo.shift(), u=await lookup(b); if(!u)continue;   /* miss: try again next visit */
      coverCache[key(b)]=u; lsSet("watchlist-covers-v2",coverCache);
      document.querySelectorAll(`[data-bk="${CSS.escape(key(b))}"]`).forEach(el=>{el.innerHTML=coverInner(b);});
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
}

/* ---- calendar ---- */
/* Genre picker: nonfiction and memoir are one choice; everything else is its own. */
const grp=b=>(b.cat==="Nonfiction"||b.cat==="Memoir & Biography")?"Nonfiction & Memoir":b.cat;
const mIdx=b=>b.p.m?b.p.y*12+b.p.m-1:null;
const nowIdx=now.getFullYear()*12+now.getMonth();
const SPAN_LO=Math.min(...items.filter(b=>b.p.m).map(mIdx),pd(winStart).y*12+pd(winStart).m-1,nowIdx);
const SPAN_HI=Math.max(...items.filter(b=>b.p.m).map(mIdx),pd(winEnd).y*12+pd(winEnd).m-1);
let genre="All", readF="all", popular=true, rFrom=SPAN_LO, rTo=SPAN_HI, shown=items, byDay={}, byMonthTBC={}, tba=[];
/* "Popular": enough Goodreads ratings to be a real contender. New releases get a lower bar
   because they haven't had time to collect ratings. Books with no ratings data are never hidden. */
const isPopular=b=>{ if(b.ratings==null)return true;
  const days=b.p.exact?(Date.parse(todayISO)-Date.parse(b.date))/864e5:(b.p.m?(nowIdx-mIdx(b))*30:9999);
  return b.ratings>=(days<120?3000:20000); };
const inRange=b=>{const i=mIdx(b); return i!=null?(i>=rFrom&&i<=rTo):(b.p.y>=Math.floor(rFrom/12)&&b.p.y<=Math.floor(rTo/12));};
const isPastItem=b=>b.p.exact?b.date<=todayISO:(b.p.m?mIdx(b)<nowIdx:b.p.y<now.getFullYear());
function applyFilter(){
  shown=items.filter(b=>(!popular||isPopular(b))&&(genre==="All"||grp(b)===genre)&&(readF==="all"||(readF==="read")===!!b.read)&&inRange(b));
  byDay={};byMonthTBC={};tba=[];
  shown.forEach(b=>{
    if(b.p.exact)(byDay[b.date]=byDay[b.date]||[]).push(b);
    else if(b.p.m)(byMonthTBC[`${b.p.y}-${b.p.m}`]=byMonthTBC[`${b.p.y}-${b.p.m}`]||[]).push(b);
    else tba.push(b);
  });
}
function monthRange(){
  if(genre!=="All"||readF!=="all"){   /* a filter is on: only show months that have something */
    return [...new Set(shown.filter(b=>b.p.m).map(mIdx))].sort((a,b)=>a-b).map(i=>[Math.floor(i/12),i%12+1]);
  }
  const out=[];for(let i=rFrom;i<=rTo;i++)out.push([Math.floor(i/12),i%12+1]);return out;
}
const bookMini=b=>`<div class="cover" data-bk="${esc(key(b))}">${coverInner(b)}</div>`;
function dayCell(y,m,d){
  const id=iso(y,m,d), bs=byDay[id]||[], hol=holidays(y)[id];
  const edge=id===winStart||id===winEnd;
  let emoji=hol?hol.e:""; if(edge&&!emoji)emoji="🏆";
  const cls=["day"]; if(id===todayISO)cls.push("today"); if(id<todayISO)cls.push("past"); if(edge)cls.push("edge");
  if(bs.length){
    cls.push("has"); if(bs.length>1)cls.push("multi"); if(bs.every(b=>b.read))cls.push("allread");
    const b0=bs[0], pre=id<winStart&&id>=BALLOT26_START;
    const art=bs.length===1?bookMini(b0)
      :`<div class="mosaic">${bs.slice(0,4).map(b=>`<div class="cover tile" data-bk="${esc(key(b))}">${coverInner(b)}</div>`).join("")}</div>`;
    return `<div class="${cls.join(" ")}" data-day="${id}"><span class="n">${d}</span>${art}${pre?'<span class="ballot26"></span>':''}
      ${emoji?`<span class="hol">${emoji}</span>`:""}${bs.length>1?`<span class="more">${bs.length} books</span>`:""}${bs.every(b=>b.read)?'<span class="chk">✓</span>':""}</div>`;
  }
  return `<div class="${cls.join(" ")}" ${hol||edge?`data-day="${id}"`:""}><span class="n">${d}</span>${emoji?`<span class="hol">${emoji}</span>`:""}</div>`;
}
function tbRow(list){return list.map(b=>`<div class="tb ${b.read?"read":""}" data-one="${esc(key(b))}"><div class="cv" data-bk="${esc(key(b))}">${coverInner(b)}</div>${b.read?'<span class="chk">✓</span>':""}<div class="bt2">${esc(b.title)}</div></div>`).join("");}
function renderCal(){
  let h="";
  monthRange().forEach(([y,m])=>{
    const first=new Date(y,m-1,1).getDay(), n=new Date(y,m,0).getDate();
    const cnt=shown.filter(b=>b.p.y===y&&b.p.m===m).length;
    h+=`<section class="month" id="m-${y}-${m}"><div class="mhead"><div class="mname">${MONTH_FULL[m-1]} <em>${y}</em></div><div class="mcount">${cnt?cnt+(cnt===1?" release":" releases"):""}</div></div>
      <div class="dow">${DOW.map(x=>`<div>${x}</div>`).join("")}</div><div class="days">`;
    for(let i=0;i<first;i++)h+=`<div class="day blank"></div>`;
    for(let d=1;d<=n;d++)h+=dayCell(y,m,d);
    h+=`</div>`;
    const t=byMonthTBC[`${y}-${m}`]; if(t)h+=`<div class="tbc"><h4>${(y*12+m-1<nowIdx)?`📅 Released in ${MONTH_FULL[m-1]}, exact day not recorded`:`🗓️ Sometime in ${MONTH_FULL[m-1]}, date TBC`}</h4><div class="tbcrow">${tbRow(t)}</div></div>`;
    h+=`</section>`;
  });
  if(!h&&!tba.length)h=`<div class="none">No ${esc(genre)} books on the list yet.</div>`;
  document.getElementById("cal").innerHTML=h;
  const yrs=[...new Set(tba.map(b=>b.p.y))].sort((a,b)=>b-a);
  document.getElementById("tba").innerHTML=yrs.map(y=>{const l=tba.filter(b=>b.p.y===y), past=y<now.getFullYear();
    return `<section class="tba"><div class="tbc"><h4>${past?`📅 Released in ${y}, exact day not recorded`:`✨ ${y}, date to be announced`}</h4><div class="tbcrow">${tbRow(l)}</div></div></section>`;}).join("");
}

function renderGenres(){
  const order=[...CATS.map(c=>grp({cat:c}))].filter((g,i,a)=>a.indexOf(g)===i).filter(g=>items.some(b=>grp(b)===g));
  const pool=items.filter(b=>!popular||isPopular(b));
  const hidden=items.length-pool.length;
  document.getElementById("genres").innerHTML=`<button class="pill tog ${popular?"on":""}" data-pop="1" title="${popular?"Showing popular books only. Tap to show everything.":"Tap to hide books with few ratings."}">🔥 Popular${popular&&hidden?`<span class="n">${hidden} hidden</span>`:""}</button>`+["All",...order].map(g=>{
    const n=g==="All"?pool.length:pool.filter(b=>grp(b)===g).length;
    return `<button class="pill ${genre===g?"on":""}" data-genre="${esc(g)}">${esc(g)}<span class="n">${n}</span></button>`;}).join("");
}
function renderMeter(){
  const readN=shown.filter(b=>b.read).length;
  document.getElementById("hcount").textContent=`${shown.length} books`;
  document.getElementById("meter").innerHTML=`<span class="chip"><b>${shown.length}</b>books showing</span><span class="chip"><b>${readN}</b>read</span><span class="chip"><b>${shown.filter(b=>!isPastItem(b)).length}</b>still to come</span>`;
}
function renderTools(){
  const opts=sel=>{let h="";for(let i=SPAN_LO;i<=SPAN_HI;i++)h+=`<option value="${i}" ${i===sel?"selected":""}>${MONTHS[i%12]} ${Math.floor(i/12)}</option>`;return h;};
  document.getElementById("rFrom").innerHTML=opts(rFrom); document.getElementById("rTo").innerHTML=opts(rTo);
  document.getElementById("reads").innerHTML=[["all","All"],["unread","Unread"],["read","Read"]].map(([k,l])=>`<button class="pill ${readF===k?"on":""}" data-read="${k}">${l}</button>`).join("");
}
const barH=()=>document.getElementById("bar").offsetHeight;
function setBarVar(){document.documentElement.style.setProperty("--barh",barH()+"px");}
function scrollToCal(){setBarVar();window.scrollTo({top:document.getElementById("cal").getBoundingClientRect().top+scrollY-barH()-6,behavior:"instant"});}
window.addEventListener("resize",setBarVar);
function refresh(){
  applyFilter(); renderGenres(); renderMeter(); renderCal(); renderTools();
  const plain=genre==="All"&&readF==="all"&&rFrom===SPAN_LO&&rTo===SPAN_HI;
  if(plain)scrollToday(false); else scrollToCal();
  findCovers();
}
document.getElementById("rFrom").addEventListener("change",e=>{rFrom=+e.target.value;if(rTo<rFrom)rTo=rFrom;refresh();});
document.getElementById("rTo").addEventListener("change",e=>{rTo=+e.target.value;if(rFrom>rTo)rFrom=rTo;refresh();});
document.getElementById("reads").addEventListener("click",e=>{const b=e.target.closest("[data-read]");if(b){readF=b.dataset.read;refresh();}});
function setGenre(g){
  genre=g; refresh();
}
document.getElementById("genres").addEventListener("click",e=>{
  if(e.target.closest("[data-pop]")){popular=!popular;refresh();return;}
  const b=e.target.closest("[data-genre]");if(b)setGenre(b.dataset.genre);});

/* ---- sheet ---- */
const fmt=s=>{const p=pd(s);return `${DOW[new Date(p.y,p.m-1,p.d).getDay()]}, ${MONTH_FULL[p.m-1]} ${p.d}, ${p.y}`;};
/* Direct link if the entry has `goodreads`, otherwise a Goodreads search for title + author. */
const grUrl=b=>b.goodreads||("https://www.goodreads.com/search?q="+encodeURIComponent(b.title.replace(/\s*\(.*?\)/g,"")+" "+b.author));
function bookBlock(b){
  const when=b.p.exact?(b.date<=todayISO?"Out now":"Releases "+MONTH_FULL[b.p.m-1]+" "+b.p.d):b.p.m?(isPastItem(b)?`Released ${MONTH_FULL[b.p.m-1]} ${b.p.y}`:`${MONTH_FULL[b.p.m-1]} ${b.p.y}, date TBC`):(isPastItem(b)?`Released in ${b.p.y}`:`${b.p.y}, date TBA`);
  return `<div class="sbook"><div class="top"><div class="mini"><div class="cv" data-bk="${esc(key(b))}">${coverInner(b)}</div></div>
    <div><h3>${esc(b.title)}</h3><div class="by">${esc(b.author)}</div>
    <div class="tags"><span class="tag g">${esc(b.cat)}</span>${b.series?`<span class="tag">${esc(b.series)}</span>`:""}${b.read?'<span class="tag m">✓ Read</span>':""}${b.ratings!=null?`<span class="tag">★ ${b.stars?b.stars.toFixed(2)+" · ":""}${b.ratings>=1e6?(b.ratings/1e6).toFixed(1)+"M":b.ratings>=1000?Math.round(b.ratings/1000)+"K":b.ratings} ratings</span>`:""}<span class="tag">${when}</span></div></div></div>
    ${b.buzz?`<div class="tags"><span class="tag b">🔥 ${esc(b.buzz)}</span></div>`:""}${b.note?`<p>${esc(b.note)}</p>`:""}
    <a class="gr" href="${esc(grUrl(b))}" target="_blank" rel="noopener">View on Goodreads ↗</a></div>`;
}
function openSheet(head,html){
  const sh=document.getElementById("sheet");
  sh.innerHTML=`<div class="shead"><div class="sdate">${head}</div><button class="xbtn" data-close="1" aria-label="Close">✕</button></div>${html}<button class="btn" data-close="1">Close</button>`;
  document.getElementById("veil").classList.add("open"); if(!document.documentElement.classList.contains("locked")){
    lockY=window.scrollY; document.body.style.top=(-lockY)+"px"; document.documentElement.classList.add("locked");
  }
  sh.scrollTop=0;
}
let lockY=0;
const closeSheet=()=>{
  document.getElementById("veil").classList.remove("open");
  if(document.documentElement.classList.contains("locked")){
    document.documentElement.classList.remove("locked"); document.body.style.top="";
    window.scrollTo({top:lockY,behavior:"instant"});     /* back to exactly where she was */
  }
};
document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")||e.target.id==="veil"){closeSheet();return;}
  const dc=e.target.closest("[data-day]");
  if(dc){const id=dc.dataset.day,p=pd(id),bs=byDay[id]||[],hol=holidays(p.y)[id];
    let head=fmt(id)+(hol?` · ${hol.e} ${hol.n}`:"");
    if(id===winStart)head+=" · 🏆 award year begins"; if(id===winEnd)head+=" · 🏆 award year ends";
    openSheet(head,bs.length?bs.map(bookBlock).join(""):`<p style="color:var(--soft);margin:0">No releases on the list today.</p>`);return;}
  const one=e.target.closest("[data-one]");
  if(one){const b=items.find(x=>key(x)===one.dataset.one);if(b)openSheet(b.p.m?`${MONTH_FULL[b.p.m-1]} ${b.p.y}`:`${b.p.y}`,bookBlock(b));}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

function scrollToday(smooth){
  const el=document.getElementById(`m-${now.getFullYear()}-${now.getMonth()+1}`)||document.querySelector(".month");
  if(el)el.scrollIntoView({behavior:smooth?"smooth":"auto",block:"start"});
}
document.getElementById("todayBtn").addEventListener("click",()=>scrollToday(true));

document.getElementById("kicker").textContent="new & upcoming reads";
document.getElementById("sub").textContent=`New and upcoming books worth watching, on the day they come out. Includes the ones with real award buzz. Pick a genre, or tap a day for details.`;
document.getElementById("foot").innerHTML=`Last refreshed ${fmt(WATCHLIST_META.lastRefreshed)}.<br>Release dates come from preview lists and often shift.`;
setBarVar(); applyFilter(); renderGenres(); renderMeter(); renderCal(); renderTools(); setBarVar(); scrollToday(false); probeImages(); findCovers();

/* ---- app bits: works offline, installable, tells you when new books were added ---- */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  navigator.serviceWorker.addEventListener("message",e=>{
    if(!e.data||e.data.type!=="fresh-ink-updated"||document.getElementById("toast"))return;
    const t=document.createElement("div"); t.className="toast"; t.id="toast";
    t.innerHTML='Fresh Ink updated <button>Refresh</button>'; document.body.appendChild(t);
    t.querySelector("button").onclick=()=>location.reload();
  });
}
const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;});
if(!standalone){
  document.getElementById("installWrap").hidden=false;
  document.getElementById("installBtn").addEventListener("click",async()=>{
    if(installEvt){installEvt.prompt();await installEvt.userChoice.catch(()=>{});installEvt=null;return;}
    openSheet("Install Fresh Ink",`<div class="sbook"><p style="margin-top:0"><b>iPhone or iPad:</b> tap the Share button in your browser, then <b>Add to Home Screen</b>.</p>
      <p><b>Android:</b> open the browser menu (three dots), then <b>Install app</b> or <b>Add to Home screen</b>.</p>
      <p>After that it opens full-screen like any other app, and it still works with no signal.</p></div>`);
  });
}
