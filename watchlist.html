<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Ballot Watch</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120f24">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120f24; --bg2:#1b1636; --card:#1f1a3d; --line:rgba(255,255,255,.09);
    --ink:#f4efe6; --soft:#b9b2cf; --faint:#7f78a0;
    --gold:#f0c060; --gold2:#c9922e; --rose:#ff7a9c; --mint:#7fe0c3;
  }
  *{ box-sizing:border-box; }
  html{ overflow-x:hidden; }
  body{ margin:0; font-family:'Manrope',sans-serif; color:var(--ink); overflow-x:hidden;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(240,192,96,.16), transparent 60%),
      radial-gradient(700px 500px at -10% 10%, rgba(255,122,156,.12), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    padding-bottom:calc(60px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color:transparent; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 20px; }
  @media (max-width:560px){ .wrap{ padding:0 14px; } }

  .back{ display:inline-block; margin:22px 0 0; font-size:12px; color:var(--faint); text-decoration:none; letter-spacing:.05em; }
  .back:hover{ color:var(--gold); }

  header{ text-align:center; padding:26px 0 30px; }
  .kicker{ font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  h1{ font-family:'Fraunces',serif; font-weight:700; font-size:clamp(40px,8vw,78px); line-height:.98; margin:12px 0 14px; letter-spacing:-.02em; }
  h1 em{ font-style:italic; font-weight:500; color:var(--gold); }
  .sub{ color:var(--soft); font-size:14.5px; line-height:1.6; max-width:560px; margin:0 auto; }

  .meter{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:22px; }
  .chip{ border:1px solid var(--line); background:rgba(255,255,255,.04); border-radius:999px; padding:8px 16px; font-size:12.5px; color:var(--soft); }
  .chip b{ color:var(--ink); font-size:15px; margin-right:5px; }

  .bar{ position:sticky; top:0; z-index:30; background:rgba(18,15,36,.88); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:12px 0; }
  .search{ width:100%; font:inherit; font-size:15px; color:var(--ink); background:rgba(255,255,255,.06);
    border:1px solid var(--line); border-radius:12px; padding:11px 14px; outline:none; margin-bottom:9px; }
  .search::placeholder{ color:var(--faint); }
  .search:focus{ border-color:var(--gold2); }
  .pills{ display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; }
  .pills::-webkit-scrollbar{ display:none; }
  .pills + .pills{ margin-top:8px; }
  .pill{ flex:0 0 auto; font:inherit; font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer;
    background:transparent; color:var(--soft); border:1px solid var(--line); white-space:nowrap; }
  .pill:hover{ color:var(--ink); border-color:var(--gold2); }
  .pill.on{ background:var(--gold); color:#2a1d05; border-color:var(--gold); }
  .pill .n{ opacity:.6; margin-left:4px; font-size:11px; }

  h2{ font-family:'Fraunces',serif; font-size:26px; margin:38px 0 4px; letter-spacing:-.01em; }
  h2 small{ font-family:'Manrope',sans-serif; font-size:12px; color:var(--faint); font-weight:500; margin-left:8px; letter-spacing:0; }
  .month{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); font-weight:700; margin:26px 0 14px;
    display:flex; align-items:center; gap:12px; }
  .month::after{ content:""; flex:1; height:1px; background:var(--line); }
  .empty{ color:var(--faint); font-style:italic; font-size:14px; padding:16px 0; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:22px 16px; }
  @media (max-width:560px){ .grid{ grid-template-columns:repeat(2,1fr); gap:20px 12px; } }

  .book{ position:relative; cursor:pointer; }
  .cover{ position:relative; aspect-ratio:2/3; border-radius:6px 10px 10px 6px; overflow:hidden;
    box-shadow:0 10px 24px rgba(0,0,0,.5), inset 3px 0 0 rgba(255,255,255,.12); transition:transform .18s ease; background:var(--card); }
  .book:hover .cover{ transform:translateY(-4px) rotate(-.6deg); }
  .cover img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ph{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; padding:44px 12px 14px; text-align:left; }
  .ph .t{ font-family:'Fraunces',serif; font-weight:700; font-size:clamp(15px,2.1vw,19px); line-height:1.12; color:#fff; text-shadow:0 1px 8px rgba(0,0,0,.35); }
  .ph .a{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.85); font-weight:700; }
  .over{ position:absolute; inset:0; pointer-events:none; }
  .date{ position:absolute; left:8px; top:8px; background:rgba(18,15,36,.86); backdrop-filter:blur(4px); border:1px solid var(--line);
    border-radius:8px; padding:4px 8px; font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--ink); }
  .date.out{ background:var(--gold); color:#2a1d05; border-color:var(--gold); }
  .check{ position:absolute; right:7px; top:7px; width:30px; height:30px; border-radius:50%; background:var(--mint); color:#06251c;
    display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .book.read .cover img, .book.read .ph{ filter:saturate(.55) brightness(.62); }
  .book.read .bt{ color:var(--soft); }
  .flag{ position:absolute; left:0; bottom:10px; background:linear-gradient(90deg,var(--rose),#ff9f6b); color:#2a0a14;
    font-size:9.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px 3px 7px; border-radius:0 6px 6px 0; }
  .bt{ font-family:'Fraunces',serif; font-weight:700; font-size:14.5px; line-height:1.22; margin:10px 0 2px; }
  .ba{ font-size:12px; color:var(--soft); }

  .lead{ display:flex; gap:18px; overflow-x:auto; padding:6px 2px 14px; scrollbar-width:none; }
  .lead::-webkit-scrollbar{ display:none; }
  .lead .book{ flex:0 0 150px; }

  /* detail sheet */
  .veil{ position:fixed; inset:0; background:rgba(8,6,20,.7); backdrop-filter:blur(6px); z-index:60; display:none;
    align-items:flex-end; justify-content:center; }
  .veil.open{ display:flex; }
  .sheet{ width:100%; max-width:560px; background:var(--bg2); border:1px solid var(--line); border-radius:22px 22px 0 0;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; }
  @media (min-width:700px){ .veil{ align-items:center; } .sheet{ border-radius:22px; } }
  .sheet .top{ display:flex; gap:16px; }
  .sheet .mini{ flex:0 0 108px; }
  .sheet h3{ font-family:'Fraunces',serif; font-size:23px; line-height:1.15; margin:0 0 4px; }
  .sheet .by{ color:var(--soft); font-size:14px; margin-bottom:10px; }
  .sheet .tags{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .tag{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:4px 10px; border-radius:999px;
    background:rgba(255,255,255,.07); color:var(--soft); }
  .tag.g{ background:rgba(240,192,96,.16); color:var(--gold); }
  .tag.b{ background:rgba(255,122,156,.16); color:var(--rose); text-transform:none; letter-spacing:0; }
  .sheet p{ color:var(--soft); font-size:14px; line-height:1.6; margin:10px 0 0; }
  .sheet .row{ display:flex; gap:10px; margin-top:18px; }
  .btn{ flex:1; font:inherit; font-weight:700; font-size:14px; padding:12px; border-radius:12px; cursor:pointer; border:1px solid var(--line);
    background:transparent; color:var(--ink); }
  .btn.p{ background:var(--gold); color:#2a1d05; border-color:var(--gold); }

  footer{ text-align:center; color:var(--faint); font-size:12px; line-height:1.7; margin:46px auto 0; max-width:540px; }
  footer code{ color:var(--soft); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="library.html">← library</a>
  <header>
    <div class="kicker" id="kicker"></div>
    <h1>The Ballot <em>Watch</em></h1>
    <p class="sub" id="sub"></p>
    <div class="meter" id="meter"></div>
  </header>
</div>

<div class="wrap">
  <div id="cal"></div>
  <footer id="foot"></footer>
</div>

<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>

<script src="watchlist-data.js"></script>
<script>
/* Standalone page: depends only on watchlist-data.js. */
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH_FULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

const key=b=>b.title+"|"+b.author;
function pd(str){const p=String(str).split("-").map(Number);
  if(p.length===3)return{y:p[0],m:p[1],d:p[2],exact:true,t:new Date(p[0],p[1]-1,p[2]).getTime()};
  if(p.length===2)return{y:p[0],m:p[1],d:null,exact:false,t:new Date(p[0],p[1]-1,28).getTime()};
  return{y:p[0],m:null,d:null,exact:false,t:new Date(p[0],11,31).getTime()};}
const today=new Date();today.setHours(0,0,0,0);
const winStart=pd(WATCHLIST_META.windowStart).t;
/* Read status is set by hand in watchlist-data.js (read:true), so it looks the
   same in every browser. Nothing is stored per-browser except cached cover lookups. */
const items=watchlist.map(b=>({...b,p:pd(b.date)}));
const isOut=b=>b.p.exact?b.p.t<=today.getTime():(b.p.m&&(b.p.y<today.getFullYear()||(b.p.y===today.getFullYear()&&b.p.m<today.getMonth()+1)));
const dateLabel=b=>b.p.exact?`${MONTHS[b.p.m-1]} ${b.p.d}`:b.p.m?`${MONTHS[b.p.m-1]} · TBC`:`${b.p.y} · TBA`;

/* ---- covers ----
   Order tried for each book: `cover` (explicit URL) -> `isbn` (Open Library) ->
   a lookup done in the browser (Google Books, then Open Library), remembered
   in this browser. If every source misses, a designed placeholder shows. ---- */
const coverCache=lsGet("watchlist-covers-v2",{});
function srcList(b){
  const l=[];
  if(b.cover)l.push(b.cover);
  if(b.isbn)l.push(`https://covers.openlibrary.org/b/isbn/${b.isbn}-L.jpg?default=false`);
  if(coverCache[key(b)])l.push(coverCache[key(b)]);
  return l;
}
function nextSrc(img){            /* onerror/tiny image: move on to the next candidate */
  const l=JSON.parse(img.dataset.srcs||"[]"); const i=+img.dataset.i+1;
  if(i<l.length){img.dataset.i=i;img.src=l[i];}else img.remove();
}
async function lookup(b){
  const last=b.author.split(" ").pop().replace(/[^\w]/g,"");
  const t=b.title.replace(/[:&].*$/,"").replace(/\(.*?\)/g,"").trim();
  try{
    const r=await fetch("https://www.googleapis.com/books/v1/volumes?maxResults=6&q="+encodeURIComponent(`intitle:${t} inauthor:${last}`));
    if(r.ok){
      const j=await r.json();
      const v=(j.items||[]).find(x=>x.volumeInfo&&x.volumeInfo.imageLinks);
      if(v){const u=(v.volumeInfo.imageLinks.thumbnail||v.volumeInfo.imageLinks.smallThumbnail).replace("http://","https://").replace("&edge=curl","");return u+"&zoom=2";}
    }
  }catch(e){}
  try{
    const r=await fetch("https://openlibrary.org/search.json?"+new URLSearchParams({title:t,author:b.author,limit:"5",fields:"cover_i"}));
    if(r.ok){const d=((await r.json()).docs||[]).find(x=>x.cover_i); if(d)return `https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`;}
  }catch(e){}
  return null;
}
async function findCovers(){
  for(const b of items){
    if(b.cover||b.isbn||key(b) in coverCache)continue;
    const u=await lookup(b);
    if(!u)continue;                      /* try again next visit */
    coverCache[key(b)]=u; lsSet("watchlist-covers-v2",coverCache);
    document.querySelectorAll(`[data-k="${CSS.escape(key(b))}"] .cover`).forEach(c=>{c.innerHTML=coverInner(b)+c.querySelector(".over").outerHTML;});
    await new Promise(r=>setTimeout(r,150));
  }
}
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h;};
function coverInner(b){
  const h=hue(b.title+b.author), l=srcList(b);
  const ph=`<div class="ph" style="background:linear-gradient(155deg,hsl(${h},48%,34%),hsl(${(h+50)%360},55%,18%))"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div></div>`;
  return l.length?`${ph}<img src="${esc(l[0])}" data-srcs="${esc(JSON.stringify(l))}" data-i="0" alt="Cover of ${esc(b.title)}" loading="lazy" onload="if(this.naturalWidth<60)nextSrc(this)" onerror="nextSrc(this)">`:ph;
}

function card(b){
  const out=isOut(b);
  return `<div class="book ${b.read?"read":""}" data-k="${esc(key(b))}">
    <div class="cover">${coverInner(b)}<span class="over">
      <span class="date ${out?"out":""}">${out?"OUT · ":""}${dateLabel(b)}</span>
      ${b.read?`<span class="check" title="Read">✓</span>`:""}
      ${b.p.t<winStart?`<span class="flag" style="background:linear-gradient(90deg,#8d86b3,#6f6893);color:#fff">2026 ballot</span>`:b.hot&&!b.read?`<span class="flag">Top pick</span>`:""}
    </span></div>
    <div class="bt">${esc(b.title)}</div><div class="ba">${esc(b.author)}</div>
  </div>`;
}
/* One calendar, soonest first: what's already out (newest first), then each
   upcoming month in order. */
function render(){
  const out=items.filter(isOut).sort((a,b)=>b.p.t-a.p.t);
  const soon=items.filter(b=>!isOut(b)).sort((a,b)=>a.p.t-b.p.t);
  let h="";
  if(out.length)h+=`<div class="month">Out now</div><div class="grid">${out.map(card).join("")}</div>`;
  let last="",open=false;
  soon.forEach(b=>{
    const l=b.p.m?`${MONTH_FULL[b.p.m-1]} ${b.p.y}`:`${b.p.y} · date to be announced`;
    if(l!==last){if(open)h+="</div>";h+=`<div class="month">${l}</div><div class="grid">`;last=l;open=true;}
    h+=card(b);
  });
  if(open)h+="</div>";
  document.getElementById("cal").innerHTML=h;
}
function meter(){
  const inWin=items.filter(b=>b.p.t>=winStart), read=inWin.filter(b=>b.read).length;
  document.getElementById("meter").innerHTML=
    `<span class="chip"><b>${read}</b>of ${inWin.length} read</span><span class="chip"><b>${items.filter(b=>!isOut(b)).length}</b>coming up</span>`;
}
const fmt=s=>{const p=pd(s);return `${MONTH_FULL[p.m-1]} ${p.d}, ${p.y}`;};

function openSheet(k){
  const b=items.find(x=>key(x)===k); if(!b)return;
  document.getElementById("sheet").innerHTML=`
    <div class="top"><div class="mini"><div class="cover">${coverInner(b)}</div></div>
    <div><h3>${esc(b.title)}</h3><div class="by">${esc(b.author)}</div>
      <div class="tags"><span class="tag g">${esc(b.cat)}</span>${b.series?`<span class="tag">${esc(b.series)}</span>`:""}
      ${b.read?`<span class="tag" style="background:rgba(127,224,195,.18);color:var(--mint)">✓ Read</span>`:""}
      <span class="tag">${isOut(b)?"Out ":"Releases "}${b.p.exact?fmt(b.date):b.p.m?MONTH_FULL[b.p.m-1]+" "+b.p.y+" (date TBC)":b.p.y+" (date TBA)"}</span></div></div></div>
    ${b.buzz?`<div class="tags"><span class="tag b">🔥 ${esc(b.buzz)}</span></div>`:""}
    ${b.note?`<p>${esc(b.note)}</p>`:""}
    <div class="row"><button class="btn p" data-close="1">Close</button></div>`;
  document.getElementById("veil").classList.add("open");
}
const closeSheet=()=>document.getElementById("veil").classList.remove("open");
document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")||e.target.id==="veil"){closeSheet();return;}
  const bk=e.target.closest(".book");if(bk)openSheet(bk.dataset.k);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

document.getElementById("kicker").textContent=`${WATCHLIST_META.windowStart.slice(0,4)} to ${WATCHLIST_META.windowEnd.slice(0,4)} award year`;
document.getElementById("sub").textContent=`Books that could land on the ${WATCHLIST_META.windowEnd.slice(0,4)} Goodreads Choice Awards ballot (eligible ${fmt(WATCHLIST_META.windowStart)} to ${fmt(WATCHLIST_META.windowEnd)}), in release order. Tap a book for details.`;
document.getElementById("foot").innerHTML=`Last refreshed ${fmt(WATCHLIST_META.lastRefreshed)}. Release dates come from preview lists and often shift.`;
render();meter();findCovers();
</script>
</body>
</html>
